<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nova Family AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f4f4f4;
    color:#111;
    min-height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(circle at 50% 35%,#fff 0%,#f5f5f5 42%,#e8e8e8 100%);
}

header{
    height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid #ddd;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(20px);
    z-index:5;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:20px;
    font-weight:700;
    letter-spacing:-.5px;
}

.logoDot{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#111;
    position:relative;
    box-shadow:0 0 25px rgba(0,0,0,.18);
}

.logoDot:after{
    content:"";
    position:absolute;
    width:9px;
    height:9px;
    background:white;
    border-radius:50%;
    top:12px;
    left:12px;
}

.headerRight{
    display:flex;
    align-items:center;
    gap:10px;
}

button{
    font-family:inherit;
    cursor:pointer;
    border:none;
}

.headerBtn{
    padding:10px 16px;
    border-radius:12px;
    background:#111;
    color:white;
    font-weight:600;
    transition:.2s;
}

.headerBtn:hover{
    transform:translateY(-1px);
    background:#292929;
}

.headerBtn.light{
    background:white;
    color:#111;
    border:1px solid #d7d7d7;
}

main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:0;
}

.coreArea{
    flex:0 0 43%;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
}

.core{
    width:180px;
    height:180px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,#fff 0%,#e9e9e9 35%,#9d9d9d 70%,#181818 100%);
    box-shadow:
        0 25px 60px rgba(0,0,0,.18),
        inset 0 0 25px rgba(255,255,255,.9);
    position:relative;
    transition:.35s;
}

.core:before{
    content:"";
    position:absolute;
    inset:-18px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,.12);
}

.core:after{
    content:"";
    position:absolute;
    inset:-35px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,.05);
}

.core.listening{
    transform:scale(1.07);
}

.core.thinking{
    animation:pulse 1.1s infinite;
}

.core.speaking{
    animation:speakPulse .75s infinite alternate;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
}

@keyframes speakPulse{
    from{transform:scale(1)}
    to{transform:scale(1.055)}
}

.coreCenter{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    font-weight:800;
    letter-spacing:-2px;
}

.status{
    margin-top:30px;
    font-size:13px;
    color:#777;
    letter-spacing:.8px;
    text-transform:uppercase;
}

.title{
    margin-top:8px;
    font-size:30px;
    font-weight:750;
    letter-spacing:-1.5px;
}

.chat{
    width:min(900px,calc(100% - 32px));
    flex:1;
    min-height:150px;
    overflow-y:auto;
    padding:10px 0 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:75%;
    padding:13px 16px;
    border-radius:18px;
    line-height:1.45;
    font-size:15px;
}

.message.user{
    align-self:flex-end;
    background:#111;
    color:white;
    border-bottom-right-radius:5px;
}

.message.nova{
    align-self:flex-start;
    background:white;
    color:#111;
    border:1px solid #dedede;
    border-bottom-left-radius:5px;
    box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.bottom{
    width:min(900px,calc(100% - 32px));
    margin:0 auto 22px;
}

.inputBox{
    display:flex;
    align-items:center;
    gap:10px;
    background:white;
    border:1px solid #d6d6d6;
    border-radius:20px;
    padding:8px;
    box-shadow:0 10px 35px rgba(0,0,0,.07);
}

#input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    padding:13px;
    font-size:15px;
    color:#111;
}

#input::placeholder{
    color:#999;
}

.iconBtn{
    width:45px;
    height:45px;
    border-radius:14px;
    background:#f0f0f0;
    color:#111;
    font-size:18px;
}

.iconBtn.active{
    background:#111;
    color:white;
}

.sendBtn{
    width:45px;
    height:45px;
    border-radius:14px;
    background:#111;
    color:white;
    font-size:18px;
}

.tools{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:10px;
}

.toolBtn{
    background:rgba(255,255,255,.75);
    border:1px solid #ddd;
    padding:8px 12px;
    border-radius:10px;
    color:#444;
    font-size:12px;
}

.loginOverlay{
    position:fixed;
    inset:0;
    background:rgba(245,245,245,.96);
    backdrop-filter:blur(20px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
}

.loginCard{
    width:min(420px,calc(100% - 40px));
    background:white;
    border:1px solid #ddd;
    border-radius:25px;
    padding:38px;
    text-align:center;
    box-shadow:0 30px 90px rgba(0,0,0,.12);
}

.loginCard h1{
    font-size:32px;
    margin-bottom:10px;
}

.loginCard p{
    color:#777;
    margin-bottom:25px;
}

.googleLogin{
    width:100%;
    padding:14px;
    border-radius:14px;
    background:#111;
    color:white;
    font-size:15px;
    font-weight:650;
}

@media(max-width:600px){

    header{
        padding:0 16px;
        height:64px;
    }

    .logo{
        font-size:17px;
    }

    .headerBtn{
        padding:8px 11px;
        font-size:12px;
    }

    .core{
        width:135px;
        height:135px;
    }

    .coreCenter{
        font-size:25px;
    }

    .title{
        font-size:25px;
    }

    .message{
        max-width:88%;
    }
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="logo">
        <div class="logoDot"></div>
        NOVA
    </div>

    <div class="headerRight">

        <button class="headerBtn light" id="voiceModeButton">
            Sprache
        </button>

        <button class="headerBtn" id="loginButton">
            Anmelden
        </button>

        <button class="headerBtn light"
                id="logoutButton"
                style="display:none">
            Abmelden
        </button>

    </div>

</header>


<main>

<section class="coreArea">

    <div class="core" id="core">
        <div class="coreCenter">N</div>
    </div>

    <div class="status" id="state">
        System bereit
    </div>

    <div class="title">
        Nova
    </div>

</section>


<section class="chat" id="chat"></section>


<section class="bottom">

    <div class="inputBox">

        <button class="iconBtn" id="micButton">
            🎙
        </button>

        <input
            id="input"
            type="text"
            autocomplete="off"
            placeholder="Sprich mit Nova..."
        >

        <button class="sendBtn" id="sendButton">
            ↑
        </button>

    </div>


    <div class="tools">

        <button class="toolBtn" id="youtubeButton">
            YouTube
        </button>

        <button class="toolBtn" id="googleButton">
            Google
        </button>

        <button class="toolBtn" id="testVoiceButton">
            Stimme testen
        </button>

    </div>

</section>

</main>
</div>


<div class="loginOverlay" id="loginOverlay">

    <div class="loginCard">

        <div class="logo"
             style="justify-content:center;margin-bottom:20px">

            <div class="logoDot"></div>
            NOVA

        </div>

        <h1>Nova Family AI</h1>

        <p>
            Deine persönliche KI.
        </p>

        <button class="googleLogin" id="googleLogin">
            Mit Google anmelden
        </button>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAKmdUuFEfqmvs5gbjcdFhB1RIg9C9EtrE",

    authDomain:
        "nova-68fc1.firebaseapp.com",

    projectId:
        "nova-68fc1",

    storageBucket:
        "nova-68fc1.firebasestorage.app",

    messagingSenderId:
        "1020069093020",

    appId:
        "1:1020069093020:web:9be72af9e60af659475759"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const provider =
    new GoogleAuthProvider();


/* =====================================================
   ELEMENTE
===================================================== */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const state =
    document.getElementById("state");

const core =
    document.getElementById("core");

const micButton =
    document.getElementById("micButton");

const sendButton =
    document.getElementById("sendButton");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const googleLogin =
    document.getElementById("googleLogin");

const loginOverlay =
    document.getElementById("loginOverlay");

const voiceModeButton =
    document.getElementById("voiceModeButton");

const youtubeButton =
    document.getElementById("youtubeButton");

const googleButton =
    document.getElementById("googleButton");

const testVoiceButton =
    document.getElementById("testVoiceButton");


/* =====================================================
   VARIABLEN
===================================================== */

let model = null;

let currentUser = null;

let isListening = false;

let isSpeaking = false;

let isThinking = false;

let voiceMode = true;

let recognition = null;

let retryTimer = null;


/* =====================================================
   CHAT
===================================================== */

function addMessage(text,type){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =====================================================
   STATUS
===================================================== */

function setState(text){

    state.textContent =
        text;
}


/* =====================================================
   MIKROFON STOPPEN
===================================================== */

function stopListening(){

    if(!recognition)
        return;

    try{
        recognition.stop();
    }catch(e){}

    isListening = false;

    micButton.classList.remove(
        "active"
    );

    core.classList.remove(
        "listening"
    );
}


/* =====================================================
   NOVA SPRICHT
===================================================== */

function speak(text){

    if(!("speechSynthesis" in window))
        return;

    stopListening();

    speechSynthesis.cancel();

    isSpeaking = true;

    core.classList.remove(
        "listening"
    );

    core.classList.remove(
        "thinking"
    );

    core.classList.add(
        "speaking"
    );

    setState(
        "Nova spricht"
    );


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "de-DE";

    utterance.rate =
        0.95;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    const voices =
        speechSynthesis.getVoices();

    const germanVoice =
        voices.find(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("de")
        );


    if(germanVoice){

        utterance.voice =
            germanVoice;

    }


    utterance.onend = () => {

        isSpeaking = false;

        core.classList.remove(
            "speaking"
        );

        setState(
            voiceMode
                ? "Bereit"
                : "Textmodus"
        );


        /*
           Erst jetzt darf Nova wieder zuhören.
        */

        if(
            voiceMode &&
            !isThinking
        ){

            setTimeout(
                startListening,
                700
            );

        }

    };


    utterance.onerror = () => {

        isSpeaking = false;

        core.classList.remove(
            "speaking"
        );

        setState(
            "Bereit"
        );

    };


    speechSynthesis.speak(
        utterance
    );
}


/* =====================================================
   SPRACHERKENNUNG
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "de-DE";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart = () => {

        if(
            isSpeaking ||
            isThinking
        ){

            stopListening();

            return;

        }


        isListening = true;

        core.classList.add(
            "listening"
        );

        micButton.classList.add(
            "active"
        );

        setState(
            "Ich höre zu"
        );

    };


    recognition.onend = () => {

        isListening = false;

        micButton.classList.remove(
            "active"
        );

        core.classList.remove(
            "listening"
        );


        if(
            !isSpeaking &&
            !isThinking
        ){

            setState(
                voiceMode
                    ? "Bereit"
                    : "Textmodus"
            );

        }

    };


    recognition.onerror =
        event => {

            console.log(
                "Speech:",
                event.error
            );

            isListening =
                false;

            micButton.classList.remove(
                "active"
            );

            core.classList.remove(
                "listening"
            );

        };


    recognition.onresult =
        event => {

            if(
                isSpeaking ||
                isThinking
            )
                return;


            const text =
                event
                    .results[0][0]
                    .transcript;


            input.value =
                text;


            sendMessage();

        };

}


/* =====================================================
   ZUHÖREN STARTEN
===================================================== */

function startListening(){

    if(!voiceMode)
        return;

    if(isSpeaking)
        return;

    if(isThinking)
        return;

    if(!recognition){

        setState(
            "Sprache nicht unterstützt"
        );

        return;
    }


    try{

        recognition.start();

    }catch(e){}

}


/* =====================================================
   FIREBASE AI
===================================================== */

async function setupAI(){

    try{

        setState(
            "KI wird geladen"
        );


        const aiModule =
            await import(
                "https://www.gstatic.com/firebasejs/12.13.0/firebase-ai.js"
            );


        const {
            getAI,
            getGenerativeModel,
            GoogleAIBackend
        } = aiModule;


        const ai =
            getAI(
                app,
                {
                    backend:
                        new GoogleAIBackend()
                }
            );


        model =
            getGenerativeModel(
                ai,
                {
                    model:
                        "gemini-3.7-flash"
                }
            );


        setState(
            "System bereit"
        );


    }catch(error){

        console.error(
            "AI Setup:",
            error
        );

        setState(
            "KI konnte nicht geladen werden"
        );

    }

}


/* =====================================================
   429 AUTOMATISCH BEHANDELN
===================================================== */

function handleQuotaError(){

    isThinking =
        false;

    core.classList.remove(
        "thinking"
    );


    const message =
        "Mein aktuelles KI-Kontingent ist gerade aufgebraucht. Ich versuche es später automatisch erneut.";


    addMessage(
        message,
        "nova"
    );


    setState(
        "Kontingent erreicht"
    );


    if(voiceMode){

        speak(
            message
        );

    }


    /*
       Nach 60 Sekunden wird die KI
       wieder getestet.
    */

    clearTimeout(
        retryTimer
    );


    retryTimer =
        setTimeout(
            async () => {

                if(!model)
                    return;

                setState(
                    "KI wird erneut getestet"
                );


                try{

                    await model.generateContent(
                        "Antworte nur mit OK."
                    );


                    setState(
                        "KI wieder verfügbar"
                    );


                }catch(error){

                    console.log(
                        "Noch nicht verfügbar:",
                        error
                    );


                    if(
                        String(error)
                            .includes("429")
                    ){

                        handleQuotaRetryOnly();

                    }

                }

            },
            60000
        );

}


/* =====================================================
   NUR RETRY, OHNE NACHRICHTEN-SPAM
===================================================== */

function handleQuotaRetryOnly(){

    clearTimeout(
        retryTimer
    );


    retryTimer =
        setTimeout(
            async () => {

                if(!model)
                    return;


                try{

                    await model.generateContent(
                        "Antworte nur mit OK."
                    );


                    setState(
                        "KI wieder verfügbar"
                    );


                }catch(error){

                    if(
                        String(error)
                            .includes("429")
                    ){

                        handleQuotaRetryOnly();

                    }

                }

            },
            60000
        );

}


/* =====================================================
   NACHRICHT SENDEN
===================================================== */

async function sendMessage(){

    const text =
        input.value.trim();


    if(!text)
        return;


    if(isThinking)
        return;


    input.value =
        "";


    stopListening();


    addMessage(
        text,
        "user"
    );


    if(!model){

        const message =
            "Die KI ist noch nicht bereit.";

        addMessage(
            message,
            "nova"
        );

        if(voiceMode)
            speak(message);

        return;
    }


    isThinking =
        true;


    core.classList.add(
        "thinking"
    );


    setState(
        "Nova denkt"
    );


    const prompt = `

Du bist Nova, eine moderne persönliche KI.

Antworte immer auf Deutsch.

Sei freundlich, natürlich und intelligent.

Normalerweise kurz antworten.

Wenn der Benutzer ausdrücklich mehr Details möchte,
darfst du ausführlicher antworten.

Wenn YouTube geöffnet werden soll:
[ACTION:YOUTUBE]

Wenn Google geöffnet werden soll:
[ACTION:GOOGLE]

Benutzer:
${text}

`;


    try{

        const result =
            await model.generateContent(
                prompt
            );


        let answer =
            result.response.text();


        let action =
            null;


        if(
            answer.includes(
                "[ACTION:YOUTUBE]"
            )
        ){

            action =
                "youtube";

            answer =
                answer.replace(
                    "[ACTION:YOUTUBE]",
                    ""
                ).trim();

        }


        if(
            answer.includes(
                "[ACTION:GOOGLE]"
            )
        ){

            action =
                "google";

            answer =
                answer.replace(
                    "[ACTION:GOOGLE]",
                    ""
                ).trim();

        }


        if(!answer){

            answer =
                "Natürlich.";

        }


        addMessage(
            answer,
            "nova"
        );


        /*
           Aktionen
        */

        if(
            action === "youtube"
        ){

            window.open(
                "https://www.youtube.com/",
                "_blank"
            );

        }


        if(
            action === "google"
        ){

            window.open(
                "https://www.google.com/",
                "_blank"
            );

        }


        isThinking =
            false;


        core.classList.remove(
            "thinking"
        );


        /*
           Nova spricht.
           Mikrofon bleibt aus.
        */

        if(voiceMode){

            speak(
                answer
            );

        }else{

            setState(
                "Textmodus"
            );

        }


    }catch(error){

        console.error(
            "AI:",
            error
        );


        const errorString =
            String(error);


        /*
           429 / QUOTA
        */

        if(
            errorString.includes("429") ||
            errorString.includes("quota") ||
            errorString.includes("Quota")
        ){

            handleQuotaError();

            return;

        }


        /*
           Andere Fehler
        */

        isThinking =
            false;


        core.classList.remove(
            "thinking"
        );


        const message =
            "Ich konnte die KI gerade nicht erreichen.";


        addMessage(
            message,
            "nova"
        );


        setState(
            "Verbindungsfehler"
        );


        if(voiceMode){

            speak(
                message
            );

        }

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    try{

        await signInWithPopup(
            auth,
            provider
        );

    }catch(error){

        console.error(
            "Login:",
            error
        );

        alert(
            "Anmeldung fehlgeschlagen."
        );

    }

}


async function logout(){

    try{

        await signOut(
            auth
        );

    }catch(error){

        console.error(
            error
        );

    }

}


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        currentUser =
            user;


        if(user){

            loginOverlay.style.display =
                "none";


            loginButton.style.display =
                "none";


            logoutButton.style.display =
                "block";


            try{

                const reference =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const snapshot =
                    await getDoc(
                        reference
                    );


                if(
                    !snapshot.exists()
                ){

                    await setDoc(
                        reference,
                        {
                            name:
                                user.displayName || "",

                            email:
                                user.email || "",

                            created:
                                Date.now()
                        }
                    );

                }

            }catch(error){

                console.log(
                    "Firestore:",
                    error
                );

            }


            if(
                chat.children.length === 0
            ){

                addMessage(
                    "Hallo! Ich bin Nova. Wie kann ich dir helfen?",
                    "nova"
                );

            }


            await setupAI();


        }else{

            loginOverlay.style.display =
                "flex";


            loginButton.style.display =
                "block";


            logoutButton.style.display =
                "none";

        }

    }
);


/* =====================================================
   BUTTONS
===================================================== */

googleLogin.onclick =
    login;

loginButton.onclick =
    login;

logoutButton.onclick =
    logout;


sendButton.onclick =
    sendMessage;


input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   MIKROFON BUTTON
===================================================== */

micButton.onclick =
    () => {

        if(!recognition){

            alert(
                "Dein Browser unterstützt keine Spracherkennung."
            );

            return;

        }


        if(isSpeaking)
            return;


        if(isListening){

            stopListening();

        }else{

            voiceMode =
                true;

            voiceModeButton.textContent =
                "Sprache";

            startListening();

        }

    };


/* =====================================================
   SPRACHMODUS
===================================================== */

voiceModeButton.onclick =
    () => {

        voiceMode =
            !voiceMode;


        if(!voiceMode){

            stopListening();

            voiceModeButton.textContent =
                "Text";

            setState(
                "Textmodus"
            );

        }else{

            voiceModeButton.textContent =
                "Sprache";

            setState(
                "Bereit"
            );

        }

    };


/* =====================================================
   STIMME TESTEN
===================================================== */

testVoiceButton.onclick =
    () => {

        speak(
            "Hallo. Ich bin Nova. Meine deutsche Stimme funktioniert."
        );

    };


/* =====================================================
   YOUTUBE
===================================================== */

youtubeButton.onclick =
    () => {

        window.open(
            "https://www.youtube.com/",
            "_blank"
        );

    };


/* =====================================================
   GOOGLE
===================================================== */

googleButton.onclick =
    () => {

        window.open(
            "https://www.google.com/",
            "_blank"
        );

    };


/* =====================================================
   VOICES
===================================================== */

if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
        () => {

            speechSynthesis.getVoices();

        };

}


setState(
    "System wird gestartet"
);

</script>

</body>
</html>
