<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Nova Family AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="stars"></div>
        <div class="stars stars2"></div>
        <div class="stars stars3"></div>
    </div>

    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <header>

        <div class="brand">
            <div class="brand-dot"></div>

            <div>
                <div class="brand-title">NOVA</div>
                <div class="brand-subtitle">FAMILY AI</div>
            </div>
        </div>

        <div class="account">

            <div id="userInfo" class="user-info hidden">

                <img
                    id="userPhoto"
                    class="user-photo"
                    alt="Profil"
                >

                <div>
                    <div id="userName">Benutzer</div>
                    <small id="userEmail"></small>
                </div>

            </div>

            <button id="loginButton" class="login-button">
                Mit Google anmelden
            </button>

            <button
                id="logoutButton"
                class="logout-button hidden"
            >
                Abmelden
            </button>

        </div>

    </header>


    <!-- ================================================= -->
    <!-- MAIN -->
    <!-- ================================================= -->

    <main>

        <div class="nova-area">

            <div id="status" class="status">
                BEREIT
            </div>

            <div id="statusText" class="status-text">
                Nova wartet
            </div>


            <!-- NOVA ORB -->

            <button
                id="microphone"
                class="nova-orb"
                aria-label="Nova starten"
            >

                <div class="orb-glow"></div>

                <div class="orb-ring ring-one"></div>
                <div class="orb-ring ring-two"></div>
                <div class="orb-ring ring-three"></div>

                <div class="orb-core">

                    <div class="orb-light"></div>

                    <div class="orb-logo">
                        N
                    </div>

                </div>

            </button>


            <div class="orb-hint">
                Tippe auf Nova und sprich
            </div>


            <!-- MODE SWITCH -->

            <div class="mode-switch">

                <button
                    id="voiceMode"
                    class="mode-button active"
                >
                    🎙 Sprache
                </button>

                <button
                    id="textMode"
                    class="mode-button"
                >
                    Aa Text
                </button>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- TEXT CHAT -->
        <!-- ================================================= -->

        <section
            id="textChat"
            class="text-chat hidden"
        >

            <div
                id="messages"
                class="messages"
            ></div>

            <div class="chat-input-area">

                <input
                    id="textInput"
                    type="text"
                    placeholder="Schreibe Nova..."
                    autocomplete="off"
                >

                <button id="sendText">
                    ➤
                </button>

            </div>

        </section>


        <!-- ================================================= -->
        <!-- CONTROL PANEL -->
        <!-- ================================================= -->

        <section class="control-panel">

            <div class="panel-title">
                NOVA SYSTEM
            </div>


            <div class="panel-row">

                <button
                    id="privateMode"
                    class="panel-button active"
                >
                    🔒 Privat
                </button>

                <button
                    id="familyMode"
                    class="panel-button"
                >
                    👨‍👩‍👧 Familie
                </button>

            </div>


            <div class="panel-row">

                <button
                    id="createFamily"
                    class="panel-button"
                >
                    + Familie erstellen
                </button>

                <button
                    id="joinFamily"
                    class="panel-button"
                >
                    Beitreten
                </button>

            </div>


            <div
                id="familyCode"
                class="family-code"
            ></div>


            <div class="memory-section">

                <div class="memory-title">
                    GESPEICHERTE ERINNERUNGEN
                </div>

                <div
                    id="memoryList"
                    class="memory-list"
                ></div>

            </div>

        </section>

    </main>


    <div id="toast" class="toast"></div>


    <script
        type="module"
        src="app.js"
    ></script>

</body>
</html>
