/* ORB */

.orb {
    width: 180px;

    background:
        radial-gradient(circle at 35% 30%, #fff 0%, #dedede 18%, #888 43%, #292929 68%, #050505 100%);
    box-shadow:
        0 0 25px rgba(255,255,255,.15),
        0 0 80px rgba(255,255,255,.08),
        inset -25px -25px 45px rgba(0,0,0,.65),
        inset 15px 15px 25px rgba(255,255,255,.25);
    transition: transform .3s ease, box-shadow .3s ease;
}

.orb::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.08);
}

.orb.listening {
    animation: listenPulse 1.1s infinite alternate;

}

.orb.thinking {

}

.orb.speaking {
    animation: speakingPulse .35s infinite alternate;
}

@keyframes listenPulse {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.07);
    }
}

@keyframes thinkingPulse {
    from {
        transform: scale(.97) rotate(0deg);

    to {

}

@keyframes speakingPulse {

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


/* =========================================================
   DEINE NEUE FIREBASE KONFIGURATION
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyAKmdUuFEfqmvs5gbjcdFhB1RIg9C9EtrE",
    authDomain: "nova-68fc1.firebaseapp.com",
    projectId: "nova-68fc1",
    storageBucket: "nova-68fc1.firebasestorage.app",
    messagingSenderId: "1020069093020",
    appId: "1:1020069093020:web:9be72af9e60af659475759"
};


/* =========================================================
   FIREBASE START
========================================================= */

let app;
let auth;
let db;

try {

    app = initializeApp(firebaseConfig);

    auth = getAuth(app);

    db = getFirestore(app);

} catch(error) {

    console.error(error);

    document.getElementById("loginError").textContent =
        "Firebase konnte nicht gestartet werden: " +
        error.message;

}


/* =========================================================
   ELEMENTE
========================================================= */

const loginOverlay =
    document.getElementById("loginOverlay");

const googleLoginBtn =
    document.getElementById("googleLoginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginError =
    document.getElementById("loginError");

const promptInput =
    document.getElementById("promptInput");

const sendBtn =
    document.getElementById("sendBtn");

const micBtn =
    document.getElementById("micBtn");

const youtubeBtn =
    document.getElementById("youtubeBtn");

const googleBtn =
    document.getElementById("googleBtn");

const chat =
    document.getElementById("chat");

const status =
    document.getElementById("status");

const orb =
    document.getElementById("orb");

const quotaText =
    document.getElementById("quotaText");

const quotaFill =
    document.getElementById("quotaFill");


/* =========================================================
   GOOGLE LOGIN
========================================================= */

const provider =
    new GoogleAuthProvider();

provider.setCustomParameters({
    prompt: "select_account"
});


googleLoginBtn.addEventListener("click", async () => {

    if (!auth) {
        loginError.textContent =
            "Firebase ist nicht korrekt eingerichtet.";
        return;
    }

    loginError.textContent = "";

    googleLoginBtn.disabled = true;
    googleLoginBtn.textContent = "Anmeldung läuft...";

    try {

        await signInWithRedirect(
            auth,
            provider
        );

    } catch(error) {

        console.error(error);

        loginError.textContent =
            "Anmeldung fehlgeschlagen: " +
            error.code +
            " – " +
            error.message;

        googleLoginBtn.disabled = false;
        googleLoginBtn.textContent =
            "Mit Google anmelden";
    }

});


/* =========================================================
   REDIRECT RESULT
========================================================= */

if (auth) {

    try {

        const result =
            await getRedirectResult(auth);

        if (result && result.user) {

            console.log(
                "Google Login erfolgreich:",
                result.user.email
            );

        }

    } catch(error) {

        console.error(
            "Redirect Login Fehler:",
            error
        );

        loginError.textContent =
            "Anmeldung fehlgeschlagen: " +
            error.code +
            " – " +
            error.message;

    }

}


/* =========================================================
   AUTH STATE
========================================================= */

if (auth) {

    onAuthStateChanged(
        auth,
        async (user) => {

            if (user) {

                loginOverlay.classList.add("hidden");

                await createUserDocument(user);

                addNovaMessage(
                    "Hallo! Ich bin Nova. Wie kann ich dir helfen?"
                );

            } else {

                loginOverlay.classList.remove("hidden");

            }

        }
    );

}


/* =========================================================
   FIRESTORE USER
========================================================= */

async function createUserDocument(user) {

    if (!db) return;

    try {

        const userRef =
            doc(db, "users", user.uid);

        const snapshot =
            await getDoc(userRef);

        if (!snapshot.exists()) {

            await setDoc(
                userRef,
                {
                    name: user.displayName || "",
                    email: user.email || "",
                    createdAt: new Date().toISOString()
                }
            );

        }

    } catch(error) {

        console.error(
            "Firestore Fehler:",
            error
        );

    }

}


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener("click", async () => {

    if (!auth) return;

    try {

        await signOut(auth);

    } catch(error) {

        console.error(error);

    }

});


/* =========================================================
   QUOTA
========================================================= */

const MAX_QUESTIONS = 20;

let questionsUsed =
    Number(
        localStorage.getItem(
            "nova_questions_used"
        ) || 0
    );

function updateQuota() {

    if (questionsUsed > MAX_QUESTIONS) {
        questionsUsed = MAX_QUESTIONS;
    }

    quotaText.textContent =
        questionsUsed +
        " / " +
        MAX_QUESTIONS;

    quotaFill.style.width =
        (
            questionsUsed /
            MAX_QUESTIONS *
            100
        ) + "%";
}

updateQuota();


function useQuestion() {

    if (questionsUsed >= MAX_QUESTIONS) {

        addNovaMessage(
            "Das lokale Fragenlimit von 20 Fragen ist erreicht."
        );

        return false;
    }

    questionsUsed++;

    localStorage.setItem(
        "nova_questions_used",
        questionsUsed
    );

    updateQuota();

    return true;
}


/* =========================================================
   CHAT
========================================================= */

function addUserMessage(text) {

    const row =
        document.createElement("div");

    row.className =
        "message user";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    row.appendChild(bubble);

    chat.appendChild(row);

    chat.scrollTop =
        chat.scrollHeight;
}


function addNovaMessage(text) {

    const row =
        document.createElement("div");

    row.className =
        "message nova";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    row.appendChild(bubble);

    chat.appendChild(row);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   GEMINI
========================================================= */

let model = null;

async function setupGemini() {

    try {

        const aiModule =
            await import(
                "https://www.gstatic.com/firebasejs/12.13.0/firebase-ai.js"
            );

        const {
            getAI,
            getGenerativeModel,
            GoogleAIBackend
        } = aiModule;

        const ai =
            getAI(
                app,
                {
                    backend:
                        new GoogleAIBackend()
                }
            );

        model =
            getGenerativeModel(
                ai,
                {
                    model:
                        "gemini-3.7-flash"
                }
            );

        console.log(
            "Gemini erfolgreich geladen."
        );

    } catch(error) {

        console.error(
            "Gemini Fehler:",
            error
        );

    }

}

setupGemini();


/* =========================================================
   NOVA PROMPT
========================================================= */

const systemInstruction = `
Du bist Nova, eine moderne persönliche KI.

Antworte auf Deutsch, außer der Benutzer bittet ausdrücklich
um eine andere Sprache.

Sei freundlich, direkt und hilfreich.

Antworte nicht unnötig lang.

Wenn der Benutzer YouTube öffnen möchte,
füge exakt am Anfang oder Ende deiner Antwort ein:

[ACTION:YOUTUBE]

Wenn der Benutzer Google öffnen möchte,
füge exakt ein:

[ACTION:GOOGLE]

Beispiele:

"Öffne YouTube"
=> [ACTION:YOUTUBE]

"Suche das im Internet"
=> [ACTION:GOOGLE]

Du kannst normale Fragen beantworten.
`;


/* =========================================================
   GEMINI ANFRAGE
========================================================= */

async function askNova(text) {

    if (!model) {

        addNovaMessage(
            "Das KI-Modell konnte noch nicht geladen werden."
        );

        return;

    }

    if (!useQuestion()) {
        return;
    }

    setThinking(true);

    try {

        const result =
            await model.generateContent(
                systemInstruction +
                "\n\nBenutzer:\n" +
                text
            );

        let answer =
            result.response.text();

        handleActions(answer);

        answer =
            answer
                .replace("[ACTION:YOUTUBE]", "")
                .replace("[ACTION:GOOGLE]", "")
                .trim();

        if (!answer) {
            answer = "Erledigt.";
        }

        addNovaMessage(answer);

        speak(answer);

    } catch(error) {

        console.error(
            "Gemini Fehler:",
            error
        );

        if (
            error.message &&
            (
                error.message.includes("429") ||
                error.message.includes("Quota") ||
                error.message.includes("quota")
            )
        ) {

            addNovaMessage(
                "Das Gemini-Fragenlimit ist momentan erreicht. Bitte versuche es später erneut."
            );

        } else {

            addNovaMessage(
                "Es ist ein Fehler bei der KI aufgetreten."
            );

        }

    } finally {

        setThinking(false);

    }

}


/* =========================================================
   ACTIONS
========================================================= */

function handleActions(answer) {

    if (
        answer.includes(
            "[ACTION:YOUTUBE]"
        )
    ) {

        window.open(
            "https://www.youtube.com/",
            "_blank"
        );

    }

    if (
        answer.includes(
            "[ACTION:GOOGLE]"
        )
    ) {

        window.open(
            "https://www.google.com/",
            "_blank"
        );

    }

}


/* =========================================================
   SEND
========================================================= */

async function sendMessage() {

    const text =
        promptInput.value.trim();

    if (!text) return;

    promptInput.value = "";

    addUserMessage(text);

    await askNova(text);

}


sendBtn.addEventListener(
    "click",
    sendMessage
);


promptInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            sendMessage();

        }

    }
);


/* =========================================================
   DIRECT BUTTONS
========================================================= */

youtubeBtn.addEventListener(
    "click",
    () => {

        window.open(
            "https://www.youtube.com/",
            "_blank"
        );

    }
);


googleBtn.addEventListener(
    "click",
    () => {

        window.open(
            "https://www.google.com/",
            "_blank"
        );

    }
);


/* =========================================================
   VOICE RECOGNITION
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let isListening = false;
let isSpeaking = false;
let isThinking = false;
let voiceMode = false;

let micTimeout = null;

const MIC_MAX_TIME = 8000;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "de-DE";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart = () => {

        isListening = true;

        clearTimeout(
            micTimeout
        );

        micTimeout =
            setTimeout(
                () => {

                    stopListening();

                },
                MIC_MAX_TIME
            );

        updateVisualState();

    };


    recognition.onresult = async event => {

        clearTimeout(
            micTimeout
        );

        const transcript =
            event.results[0][0].transcript;

        if (!transcript.trim()) {
            return;
        }

        addUserMessage(
            transcript
        );

        await askNova(
            transcript
        );

    };


    recognition.onend = () => {

        isListening = false;

        clearTimeout(
            micTimeout
        );

        micTimeout = null;

        updateVisualState();

    };


    recognition.onerror = event => {

        console.error(
            "Speech Recognition:",
            event.error
        );

        isListening = false;

        clearTimeout(
            micTimeout
        );

        updateVisualState();

    };

} else {

    micBtn.disabled = true;

    micBtn.textContent =
        "Mikrofon nicht unterstützt";

}


/* =========================================================
   START LISTENING
========================================================= */

function startListening() {

    if (!recognition) {

        addNovaMessage(
            "Dein Browser unterstützt keine Spracherkennung."
        );

        return;

    }

    if (isSpeaking || isThinking) {
        return;
    }

    try {

        recognition.start();

    } catch(error) {

        console.log(
            "Recognition konnte nicht gestartet werden.",
            error
        );

    }

}


/* =========================================================
   STOP LISTENING
========================================================= */

function stopListening() {

    if (!recognition) return;

    clearTimeout(
        micTimeout
    );

    micTimeout = null;

    try {

        recognition.stop();

    } catch(error) {

        console.log(error);

    }

}


/* =========================================================
   MIKROFON BUTTON
========================================================= */

micBtn.addEventListener(
    "click",
    () => {

        voiceMode = true;

        if (isListening) {

            stopListening();

        } else {

            startListening();

        }

    }
);


/* =========================================================
   SPEECH SYNTHESIS
========================================================= */

function speak(text) {

    if (
        !window.speechSynthesis
    ) {
        return;
    }

    stopListening();

    window.speechSynthesis.cancel();

    isSpeaking = true;

    updateVisualState();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "de-DE";

    utterance.rate =
        1;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    const voices =
        window.speechSynthesis
            .getVoices();

    const germanVoice =
        voices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith("de")
        );

    if (germanVoice) {

        utterance.voice =
            germanVoice;

    }


    utterance.onend = () => {

        isSpeaking = false;

        updateVisualState();

        if (voiceMode) {

            setTimeout(
                () => {

                    if (
                        !isSpeaking &&
                        !isThinking &&
                        voiceMode
                    ) {

                        startListening();

                    }

                },
                700
            );

        }

    };


    utterance.onerror = () => {

        isSpeaking = false;

        updateVisualState();

    };


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   THINKING
========================================================= */

function setThinking(value) {

    isThinking =
        value;

    updateVisualState();

}


/* =========================================================
   VISUAL STATE
========================================================= */

function updateVisualState() {

    orb.classList.remove(
        "listening",
        "thinking",
        "speaking"
    );

    micBtn.classList.remove(
        "micActive"
    );


    if (isSpeaking) {

        orb.classList.add(
            "speaking"
        );

        status.textContent =
            "Nova spricht...";

        return;

    }


    if (isThinking) {

        orb.classList.add(
            "thinking"
        );

        status.textContent =
            "Nova denkt...";

        return;

    }


    if (isListening) {

        orb.classList.add(
            "listening"
        );

        micBtn.classList.add(
            "micActive"
        );

        status.textContent =
            "Ich höre zu...";

        return;

    }


    status.textContent =
        "Bereit";

}


/* =========================================================
   INITIAL STATUS
========================================================= */

updateVisualState();


/* =========================================================
   SPEECH VOICES RELOAD
========================================================= */

if (
    window.speechSynthesis
) {

    window.speechSynthesis.onvoiceschanged =
        () => {

            window.speechSynthesis
                .getVoices();

        };

}


/* =========================================================
   DEBUG INFO
========================================================= */

console.log(
    "Nova Family AI gestartet."
);

console.log(
    "Firebase Projekt:",
    firebaseConfig.projectId
);

console.log(
    "Mikrofon-Limit:",
    MIC_MAX_TIME / 1000,
    "Sekunden"
);

</script>
