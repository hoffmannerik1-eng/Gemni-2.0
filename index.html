<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


/* =========================================================
   DEINE FIREBASE CONFIG
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyAKmdUuFEfqmvs5gbjcdFhB1RIg9C9EtrE",
    authDomain: "nova-68fc1.firebaseapp.com",
    projectId: "nova-68fc1",
    storageBucket: "nova-68fc1.firebasestorage.app",
    messagingSenderId: "1020069093020",
    appId: "1:1020069093020:web:9be72af9e60af659475759"
};


/* =========================================================
   FIREBASE START
========================================================= */

let app;
let auth;
let db;
let model = null;

try {

    app = initializeApp(firebaseConfig);

    auth = getAuth(app);

    db = getFirestore(app);

} catch(error) {

    console.error(error);

    document.getElementById("loginError").textContent =
        "Firebase konnte nicht gestartet werden: " + error.message;

}


/* =========================================================
   ELEMENTE
========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const appScreen =
    document.getElementById("app");

const googleLogin =
    document.getElementById("googleLogin");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginError =
    document.getElementById("loginError");

const userName =
    document.getElementById("userName");

const status =
    document.getElementById("status");

const orb =
    document.getElementById("orb");

const chat =
    document.getElementById("chat");

const userInput =
    document.getElementById("userInput");

const sendBtn =
    document.getElementById("sendBtn");

const micBtn =
    document.getElementById("micBtn");

const voiceBtn =
    document.getElementById("voiceBtn");

const youtubeBtn =
    document.getElementById("youtubeBtn");

const googleBtn =
    document.getElementById("googleBtn");

const quotaText =
    document.getElementById("quotaText");

const quotaFill =
    document.getElementById("quotaFill");


/* =========================================================
   GOOGLE LOGIN
========================================================= */

const provider =
    new GoogleAuthProvider();

provider.setCustomParameters({
    prompt: "select_account"
});


googleLogin.addEventListener("click", async () => {

    if (!auth) return;

    loginError.textContent = "";

    googleLogin.disabled = true;
    googleLogin.textContent = "Anmeldung...";

    try {

        await signInWithPopup(auth, provider);

    } catch(error) {

        console.error(error);

        let message =
            "Anmeldung fehlgeschlagen: " + error.message;

        if (error.code === "auth/api-key-not-valid") {

            message =
                "Firebase lehnt den API-Key ab. Bitte überprüfe den aktuellen Web-API-Key in den Firebase-Projekteinstellungen.";

        }

        if (error.code === "auth/unauthorized-domain") {

            message =
                "Diese GitHub-Pages-Domain ist in Firebase noch nicht autorisiert.";

        }

        if (error.code === "auth/popup-blocked") {

            message =
                "Der Browser hat das Google-Anmeldefenster blockiert.";

        }

        if (error.code === "auth/popup-closed-by-user") {

            message =
                "Das Anmeldefenster wurde geschlossen.";

        }

        loginError.textContent = message;

    } finally {

        googleLogin.disabled = false;
        googleLogin.textContent = "Mit Google anmelden";

    }

});


/* =========================================================
   AUTH STATE
========================================================= */

if (auth) {

    onAuthStateChanged(auth, async (user) => {

        if (user) {

            loginScreen.classList.add("hidden");
            appScreen.classList.remove("hidden");

            userName.textContent =
                user.displayName ||
                user.email ||
                "Benutzer";

            await createUserDocument(user);

            updateQuota();

        } else {

            loginScreen.classList.remove("hidden");
            appScreen.classList.add("hidden");

            userName.textContent = "";

        }

    });

}


/* =========================================================
   FIRESTORE USER
========================================================= */

async function createUserDocument(user) {

    if (!db) return;

    try {

        const userRef =
            doc(db, "users", user.uid);

        const existing =
            await getDoc(userRef);

        if (!existing.exists()) {

            await setDoc(userRef, {

                name: user.displayName || "",
                email: user.email || "",
                createdAt: new Date().toISOString()

            });

        }

    } catch(error) {

        console.error(
            "Firestore Fehler:",
            error
        );

    }

}


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener("click", async () => {

    try {

        await signOut(auth);

    } catch(error) {

        console.error(error);

    }

});


/* =========================================================
   QUOTA
========================================================= */

const MAX_QUESTIONS = 20;

let questionsUsed =
    Number(
        localStorage.getItem(
            "nova_questions_used"
        ) || 0
    );


function updateQuota() {

    questionsUsed =
        Math.max(
            0,
            Math.min(
                MAX_QUESTIONS,
                questionsUsed
            )
        );

    quotaText.textContent =
        questionsUsed + " / " + MAX_QUESTIONS;

    quotaFill.style.width =
        ((questionsUsed / MAX_QUESTIONS) * 100) + "%";

}


function useQuestion() {

    if (questionsUsed >= MAX_QUESTIONS) {

        return false;

    }

    questionsUsed++;

    localStorage.setItem(
        "nova_questions_used",
        questionsUsed
    );

    updateQuota();

    return true;

}


updateQuota();


/* =========================================================
   GEMINI
========================================================= */

async function initializeAI() {

    if (model) return true;

    try {

        const aiModule =
            await import(
                "https://www.gstatic.com/firebasejs/12.13.0/firebase-ai.js"
            );

        const {
            getAI,
            getGenerativeModel,
            GoogleAIBackend
        } = aiModule;

        const ai =
            getAI(
                app,
                {
                    backend:
                        new GoogleAIBackend()
                }
            );

        model =
            getGenerativeModel(
                ai,
                {
                    model: "gemini-3.7-flash"
                }
            );

        return true;

    } catch(error) {

        console.error(
            "AI Initialisierung:",
            error
        );

        return false;

    }

}


/* =========================================================
   CHAT UI
========================================================= */

function addMessage(text, type) {

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    status.textContent = text;

}


/* =========================================================
   ORB
========================================================= */

function setOrb(mode) {

    orb.classList.remove(
        "listening",
        "thinking",
        "speaking"
    );

    if (mode) {

        orb.classList.add(mode);

    }

}


/* =========================================================
   GEMINI REQUEST
========================================================= */

async function askNova(question) {

    if (!question.trim()) return;

    if (questionsUsed >= MAX_QUESTIONS) {

        addMessage(
            "Das lokale Fragenlimit von 20 Fragen wurde erreicht.",
            "nova"
        );

        return;

    }

    if (!useQuestion()) {

        return;

    }

    addMessage(
        question,
        "user"
    );

    userInput.value = "";

    setStatus("Nova denkt...");
    setOrb("thinking");

    const aiReady =
        await initializeAI();

    if (!aiReady) {

        setStatus("Fehler bei der KI.");

        setOrb(null);

        addMessage(
            "Die KI konnte nicht initialisiert werden.",
            "nova"
        );

        return;

    }


    try {

        const systemPrompt = `

Du bist Nova, eine moderne persönliche KI.

Antworte auf Deutsch, sofern der Benutzer nicht
eine andere Sprache verwendet.

Sei freundlich, intelligent, direkt und natürlich.

Keine langen unnötigen Einleitungen.

Du kannst bei Bedarf erklären, rechnen,
programmieren und Fragen beantworten.

WICHTIG:

Wenn der Benutzer YouTube öffnen möchte,
füge exakt diesen Text ein:

[ACTION:YOUTUBE]

Wenn der Benutzer Google öffnen möchte,
füge exakt diesen Text ein:

[ACTION:GOOGLE]

Beispiele:

"Öffne YouTube"
=> [ACTION:YOUTUBE]

"Öffne Google"
=> [ACTION:GOOGLE]

Du sollst dabei trotzdem kurz antworten.

`;

        const prompt =
            systemPrompt +
            "\n\nBenutzer:\n" +
            question;

        const result =
            await model.generateContent(prompt);

        let answer =
            result.response.text();

        let action = null;


        if (
            answer.includes(
                "[ACTION:YOUTUBE]"
            )
        ) {

            action = "youtube";

            answer =
                answer.replace(
                    "[ACTION:YOUTUBE]",
                    ""
                );

        }


        if (
            answer.includes(
                "[ACTION:GOOGLE]"
            )
        ) {

            action = "google";

            answer =
                answer.replace(
                    "[ACTION:GOOGLE]",
                    ""
                );

        }


        answer =
            answer.trim();


        if (!answer) {

            answer =
                action === "youtube"
                    ? "Ich öffne YouTube."
                    : action === "google"
                        ? "Ich öffne Google."
                        : "Erledigt.";

        }


        addMessage(
            answer,
            "nova"
        );


        if (action === "youtube") {

            window.open(
                "https://www.youtube.com/",
                "_blank"
            );

        }


        if (action === "google") {

            window.open(
                "https://www.google.com/",
                "_blank"
            );

        }


        speak(answer);

    } catch(error) {

        console.error(error);

        let errorText =
            "Es ist ein Fehler aufgetreten.";

        if (
            error.message &&
            error.message.includes("429")
        ) {

            errorText =
                "Das Gemini-Limit wurde erreicht. Bitte später erneut versuchen.";

        } else if (
            error.message &&
            error.message
                .toLowerCase()
                .includes("api key")
        ) {

            errorText =
                "Der Firebase API-Key wird von Firebase abgelehnt.";

        } else if (
            error.message
        ) {

            errorText =
                error.message;

        }


        addMessage(
            errorText,
            "nova"
        );

        setStatus(
            "Fehler"
        );

    } finally {

        setOrb(null);

    }

}


/* =========================================================
   SEND
========================================================= */

sendBtn.addEventListener(
    "click",
    () => {

        askNova(
            userInput.value
        );

    }
);


userInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            askNova(
                userInput.value
            );

        }

    }
);


/* =========================================================
   SPEECH SYNTHESIS
========================================================= */

let isSpeaking = false;
let voiceMode = true;


function speak(text) {

    if (!voiceMode) {

        setStatus("Nova ist bereit.");

        if (isListening) {

            startListening();

        }

        return;

    }


    if (
        !("speechSynthesis" in window)
    ) {

        setStatus("Nova ist bereit.");

        return;

    }


    stopListening();

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang = "de-DE";

    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;


    const voices =
        speechSynthesis.getVoices();

    const germanVoice =
        voices.find(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("de")
        );

    if (germanVoice) {

        utterance.voice =
            germanVoice;

    }


    isSpeaking = true;

    setStatus(
        "Nova spricht..."
    );

    setOrb("speaking");


    utterance.onend = () => {

        isSpeaking = false;

        setOrb(null);

        setStatus(
            "Nova ist bereit."
        );


        if (voiceMode) {

            setTimeout(
                () => {

                    startListening();

                },
                700
            );

        }

    };


    utterance.onerror = () => {

        isSpeaking = false;

        setOrb(null);

        setStatus(
            "Nova ist bereit."
        );

    };


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

let recognition = null;
let isListening = false;
let micTimeout = null;

const MIC_MAX_TIME = 8000;


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "de-DE";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart = () => {

        isListening = true;

        setOrb("listening");

        setStatus(
            "Ich höre zu..."
        );


        clearTimeout(
            micTimeout
        );


        micTimeout =
            setTimeout(
                () => {

                    stopListening();

                },
                MIC_MAX_TIME
            );

    };


    recognition.onresult = event => {

        clearTimeout(
            micTimeout
        );

        const text =
            event.results[0][0].transcript;

        stopListening();

        if (text.trim()) {

            askNova(text);

        }

    };


    recognition.onend = () => {

        clearTimeout(
            micTimeout
        );

        isListening = false;

        setOrb(null);

        if (!isSpeaking) {

            setStatus(
                "Nova ist bereit."
            );

        }

    };


    recognition.onerror = event => {

        clearTimeout(
            micTimeout
        );

        isListening = false;

        setOrb(null);

        console.error(
            "Speech:",
            event.error
        );

        if (
            event.error !==
            "aborted"
        ) {

            setStatus(
                "Mikrofon konnte nicht verwendet werden."
            );

        }

    };

}


/* =========================================================
   START LISTENING
========================================================= */

function startListening() {

    if (!recognition) {

        setStatus(
            "Spracherkennung wird von diesem Browser nicht unterstützt."
        );

        return;

    }


    if (isSpeaking) {

        return;

    }


    if (isListening) {

        return;

    }


    try {

        recognition.start();

    } catch(error) {

        console.error(error);

    }

}


/* =========================================================
   STOP LISTENING
========================================================= */

function stopListening() {

    clearTimeout(
        micTimeout
    );

    if (
        recognition &&
        isListening
    ) {

        try {

            recognition.stop();

        } catch(error) {

            console.error(error);

        }

    }

    isListening = false;

    setOrb(null);

}


/* =========================================================
   MICROPHONE BUTTON
========================================================= */

micBtn.addEventListener(
    "click",
    () => {

        if (isListening) {

            stopListening();

        } else {

            startListening();

        }

    }
);


/* =========================================================

========================================================= */

voiceBtn.addEventListener(

    () => {

        voiceMode =

        voiceBtn.textContent =
