/* =========================================================

} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

/* =========================================================

let app = null;

try {

/* =========================================================
   LOGIN ERROR
========================================================= */

function showLoginError(error) {

    let message =
        error?.message ||
        String(error);

    loginError.textContent =
        "Fehler: " + message;

}


/* =========================================================
   GOOGLE PROVIDER
========================================================= */

const provider =
    new GoogleAuthProvider();

provider.setCustomParameters({
    prompt: "select_account"
});


/* =========================================================
   GOOGLE LOGIN
========================================================= */

googleLoginBtn.addEventListener(
    "click",
    async () => {

        if (!auth) {

            loginError.textContent =
                "Firebase wurde nicht korrekt gestartet.";

            return;
        }

        loginError.textContent = "";

        loginStatus.textContent =
            "Google-Anmeldung wird geöffnet...";

        googleLoginBtn.disabled =
            true;

        googleLoginBtn.textContent =
            "Anmeldung läuft...";


        try {

            const result =
                await signInWithPopup(
                    auth,
                    provider
                );

            console.log(
                "Login erfolgreich:",
                result.user.email
            );

            loginStatus.textContent =
                "Anmeldung erfolgreich.";

        } catch (error) {

            console.error(
                "Google Login Fehler:",
                error
            );

            loginStatus.textContent = "";

            let errorText =
                error.code ||
                error.message ||
                "Unbekannter Fehler";


            if (
                error.code ===
                "auth/api-key-not-valid"
            ) {

                errorText =
                    "Der Firebase API-Key ist ungültig. Bitte in Firebase Console den aktuellen Web-API-Key prüfen.";

            } else if (
                error.code ===
                "auth/unauthorized-domain"
            ) {

                errorText =
                    "Diese GitHub-Pages-Domain ist in Firebase noch nicht als autorisierte Domain eingetragen.";

            } else if (
                error.code ===
                "auth/popup-blocked"
            ) {

                errorText =
                    "Der Browser hat das Google-Anmeldefenster blockiert. Bitte Popups für diese Seite erlauben.";

            } else if (
                error.code ===
                "auth/popup-closed-by-user"
            ) {

                errorText =
                    "Das Google-Anmeldefenster wurde geschlossen.";

            }

            loginError.textContent =
                errorText;

        } finally {

            googleLoginBtn.disabled =
                false;

            googleLoginBtn.textContent =
                "Mit Google anmelden";

        }

    }
);


/* =========================================================
   AUTH STATE
========================================================= */

if (auth) {

    onAuthStateChanged(
        auth,
        async (user) => {

            console.log(
                "Auth State:",
                user
            );


            if (user) {

                /* LOGIN ERFOLGREICH */

                loginOverlay.classList.add(
                    "hidden"
                );

                loginError.textContent = "";

                loginStatus.textContent = "";

                await createUserDocument(
                    user
                );

                chat.innerHTML = "";

                addNovaMessage(
                    "Hallo " +
                    (
                        user.displayName ||
                        ""
                    ) +
                    "! Ich bin Nova. Wie kann ich dir helfen?"
                );

            } else {

                /* NICHT ANGEMELDET */

                loginOverlay.classList.remove(
                    "hidden"
                );

            }

        }
    );

}


/* =========================================================
   FIRESTORE USER
========================================================= */

async function createUserDocument(
    user
) {

    if (!db) return;

    try {

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );

        const snapshot =
            await getDoc(
                userRef
            );

        if (!snapshot.exists()) {

            await setDoc(
                userRef,
                {
                    name:
                        user.displayName || "",

                    email:
                        user.email || "",

                    createdAt:
                        new Date().toISOString()
                }
            );

        }

    } catch (error) {

        console.error(
            "Firestore Fehler:",
            error
        );

    }

}

   LOGOUT
========================================================= */

logoutBtn.addEventListener(

        try {

            );

        }

    }
);


/* =========================================================
   QUOTA
========================================================= */

const MAX_QUESTIONS = 20;

let questionsUsed =
    Number(
        localStorage.getItem(
            "nova_questions_used"
        ) || 0
    );


function updateQuota() {

    if (
        questionsUsed >
        MAX_QUESTIONS
    ) {

        questionsUsed =
            MAX_QUESTIONS;

    }

    quotaText.textContent =
        questionsUsed +
        " / " +
        MAX_QUESTIONS;

    quotaFill.style.width =
        (
            questionsUsed /
            MAX_QUESTIONS *
            100
        ) + "%";

}


updateQuota();


function useQuestion() {

    if (
        questionsUsed >=
        MAX_QUESTIONS
    ) {

        addNovaMessage(
            "Das lokale Limit von 20 Fragen wurde erreicht."
        );

        return false;
    }

    questionsUsed++;

    localStorage.setItem(
        "nova_questions_used",
        questionsUsed
    );

    updateQuota();

    return true;
}

) {

    row.className =

    const bubble =

        text;

    row.appendChild(

    );

    chat.appendChild(
        row

    chat.scrollTop =

}

) {

    );

    );

}

   GEMINI
========================================================= */

let model = null;


async function setupGemini() {

    try {

        const aiModule =
            await import(
                "https://www.gstatic.com/firebasejs/12.13.0/firebase-ai.js"
            );


        const {
            getAI,
            getGenerativeModel,
            GoogleAIBackend
        } = aiModule;


        const ai =
            getAI(
                app,
                {
                    backend:
                        new GoogleAIBackend()
                }
            );


        model =
            getGenerativeModel(
                ai,
                {
                    model:
                        "gemini-3.7-flash"
                }
            );


        console.log(
            "Gemini geladen."
        );

    } catch (error) {

        console.error(
            "Gemini Fehler:",
            error
        );

    }

}


setupGemini();


/* =========================================================
   NOVA PROMPT
========================================================= */

const systemInstruction = `

Du bist Nova, eine moderne persönliche KI.

Sprich Deutsch, außer der Benutzer verlangt eine andere Sprache.

Sei freundlich, direkt und hilfreich.

Antworte möglichst verständlich und nicht unnötig lang.

Wenn der Benutzer YouTube öffnen möchte,
füge [ACTION:YOUTUBE] ein.

Wenn der Benutzer Google öffnen möchte,
füge [ACTION:GOOGLE] ein.

`;


/* =========================================================
   GEMINI ANFRAGE
========================================================= */

async function askNova(
    text
) {

    if (!model) {

        addNovaMessage(
            "Die KI wird noch geladen. Bitte versuche es gleich noch einmal."
        );

        return;
    }


    if (!useQuestion()) {
        return;
    }


    setThinking(
        true
    );


    try {

        const result =
            await model.generateContent(
                systemInstruction +
                "\n\nBenutzer:\n" +
                text
            );


        let answer =
            result.response.text();


        handleActions(
            answer
        );


        answer =
            answer
                .replace(
                    "[ACTION:YOUTUBE]",
                    ""
                )
                .replace(
                    "[ACTION:GOOGLE]",
                    ""
                )
                .trim();


        if (!answer) {

            answer =
                "Erledigt.";

        }


        addNovaMessage(
            answer
        );


        speak(
            answer
        );


    } catch (error) {

        console.error(
            "Gemini Anfrage Fehler:",
            error
        );


        if (
            error.message &&
            (
                error.message.includes(
                    "429"
                ) ||
                error.message.toLowerCase().includes(
                    "quota"
                )
            )
        ) {

            addNovaMessage(
                "Das Gemini-Kontingent ist momentan erreicht. Bitte später erneut versuchen."
            );

        } else {

            addNovaMessage(
                "Bei der KI ist ein Fehler aufgetreten."
            );

        }

    } finally {

        setThinking(
            false
        );

    }

}


/* =========================================================
   ACTIONS
========================================================= */

function handleActions(
    answer
) {

    if (
        answer.includes(
            "[ACTION:YOUTUBE]"
        )
    ) {

        window.open(
            "https://www.youtube.com/",
            "_blank"
        );

    }


    if (
        answer.includes(
            "[ACTION:GOOGLE]"
        )
    ) {

        window.open(
            "https://www.google.com/",
            "_blank"
        );

    }

}

   SEND
========================================================= */

async function sendMessage() {

    const text =
        promptInput.value.trim();


    if (!text) return;


    promptInput.value =
        "";


    addUserMessage(
        text

    await askNova(
        text
    );

}


sendBtn.addEventListener(

promptInput.addEventListener(

========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;

let isThinking = false;

let voiceMode = false;

const MIC_MAX_TIME =
    8000;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "de-DE";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            isListening =
                true;


            clearTimeout(
                micTimeout
            );


            micTimeout =
                setTimeout(
                    () => {

                        stopListening();

                    },
                    MIC_MAX_TIME
                );


            updateVisualState();

        };


    recognition.onresult =
        async event => {

            clearTimeout(
                micTimeout
            );


            const transcript =
                event
                    .results[0][0]
                    .transcript;


            if (
                !transcript.trim()
            ) {

                return;

            }


            addUserMessage(
                transcript
            );


            await askNova(
                transcript
            );

        };


    recognition.onend =
        () => {

            isListening =
                false;


            clearTimeout(
                micTimeout
            );


            micTimeout =
                null;


            updateVisualState();

        };


    recognition.onerror =
        event => {

            console.error(
                "Speech Error:",
                event.error
            );


            isListening =
                false;


            clearTimeout(
                micTimeout
            );


            updateVisualState();

        };

} else {

    micBtn.disabled =
        true;

    micBtn.textContent =
        "Mikrofon nicht unterstützt";

}


/* =========================================================
   START LISTENING
========================================================= */

function startListening() {

    if (!recognition) {

        addNovaMessage(
            "Dein Browser unterstützt keine Spracherkennung."
        );

        return;

    }


    if (
        isSpeaking ||
        isThinking
    ) {

        return;

    }


    try {

        recognition.start();

    } catch (error) {

        console.log(
            error
        );

    }

}


/* =========================================================
   STOP LISTENING
========================================================= */

function stopListening() {

    if (!recognition)
        return;


    clearTimeout(
        micTimeout
    );


    micTimeout =
        null;


    try {

        recognition.stop();

    } catch (error) {

        console.log(
            error
        );

    }

}


/* =========================================================
   MIC BUTTON
========================================================= */

micBtn.addEventListener(
    "click",
    () => {

        voiceMode =
            true;


        if (isListening) {

            stopListening();

        } else {

            startListening();

        }

    }
);


/* =========================================================
   SPEECH
========================================================= */

function speak(
    text
) {

    if (
        !window.speechSynthesis
    ) {

        return;

    }


    stopListening();


    window.speechSynthesis.cancel();


    isSpeaking =
        true;


    updateVisualState();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "de-DE";


    utterance.rate =
        1;


    utterance.pitch =
        1;


    utterance.volume =
        1;


    const voices =
        window.speechSynthesis
            .getVoices();


    const germanVoice =
        voices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith("de")
        );


    if (germanVoice) {

        utterance.voice =
            germanVoice;

    }


    utterance.onend =
        () => {

            isSpeaking =
                false;


            updateVisualState();


            if (voiceMode) {

                setTimeout(
                    () => {

                        if (
                            !isSpeaking &&
                            !isThinking &&
                            voiceMode
                        ) {

                            startListening();

                        }

                    },
                    700
                );

            }

        };


    utterance.onerror =
        () => {

            isSpeaking =
                false;

            updateVisualState();

        };


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   THINKING
========================================================= */

function setThinking(
    value
) {

    isThinking =
        value;

    updateVisualState();

}


/* =========================================================
   VISUAL STATE
========================================================= */

function updateVisualState() {

    orb.classList.remove(
        "listening",
        "thinking",
        "speaking"
    );


    micBtn.classList.remove(
        "micActive"
    );


    if (isSpeaking) {

        orb.classList.add(
            "speaking"
        );

        status.textContent =
            "Nova spricht...";

        return;

    }


    if (isThinking) {

        orb.classList.add(
            "thinking"
        );

        status.textContent =
            "Nova denkt...";

        return;

    }


    if (isListening) {

        orb.classList.add(
            "listening"
        );

        micBtn.classList.add(
            "micActive"
        );

        status.textContent =
            "Ich höre zu...";

        return;

    }


    status.textContent =
        "Bereit";

}


updateVisualState();


/* =========================================================
   DEBUG
========================================================= */

console.log(
    "Nova Family AI gestartet"
);

console.log(
    "Firebase Project:",
    firebaseConfig.projectId
);

console.log(
    "Microphone limit:",
    MIC_MAX_TIME / 1000,
    "seconds"
);

</script>
