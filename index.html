<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nova Family AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#111;
    min-height:100vh;
    overflow:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.app{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* TOP BAR */

.topbar{
    height:72px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(20px);
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    z-index:10;
}

.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo span{
    color:#777;
}

.top-right{
    display:flex;
    gap:10px;
    align-items:center;
}

.btn{
    border:1px solid #d5d5d5;
    background:#fff;
    color:#111;
    padding:10px 15px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

.btn:hover{
    background:#eee;
}

.btn.black{
    background:#111;
    color:white;
    border-color:#111;
}

.btn.black:hover{
    background:#333;
}

/* QUOTA */

.quotaBox{
    position:absolute;
    top:88px;
    left:20px;
    width:190px;
    background:white;
    border:1px solid #ddd;
    border-radius:15px;
    padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.07);
    z-index:5;
}

.quotaTitle{
    font-size:12px;
    color:#777;
    margin-bottom:5px;
}

#quotaText{
    font-size:17px;
    font-weight:800;
}

.quotaBar{
    width:100%;
    height:7px;
    background:#e8e8e8;
    border-radius:10px;
    overflow:hidden;
    margin-top:8px;
}

#quotaFill{
    width:0%;
    height:100%;
    background:#111;
    transition:.3s;
}

#quotaStatus{
    font-size:11px;
    color:#777;
    margin-top:7px;
}

#quotaReset{
    display:none;
    margin-top:8px;
    width:100%;
    padding:7px;
    border:0;
    border-radius:8px;
    background:#111;
    color:white;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    position:relative;
    overflow:hidden;
}

/* CENTER */

.center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
}

.orb{
    width:190px;
    height:190px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,#fff 0%,#ddd 30%,#888 60%,#111 100%);
    box-shadow:
        0 0 30px rgba(0,0,0,.2),
        inset -20px -20px 50px rgba(0,0,0,.35),
        inset 15px 15px 30px rgba(255,255,255,.7);
    animation:float 4s ease-in-out infinite;
    position:relative;
}

.orb:after{
    content:"";
    position:absolute;
    inset:-12px;
    border-radius:50%;
    border:1px solid #bbb;
    opacity:.5;
}

.orb.listening{
    animation:pulse 1s infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.07)}
    100%{transform:scale(1)}
}

.status{
    margin-top:25px;
    font-size:15px;
    color:#666;
    min-height:20px;
}

.title{
    margin-top:8px;
    font-size:30px;
    font-weight:800;
    letter-spacing:-1.5px;
}

/* CHAT */

.chat{
    width:min(700px,90%);
    height:180px;
    margin-top:25px;
    overflow-y:auto;
    padding:10px;
}

.message{
    padding:12px 15px;
    margin:8px 0;
    border-radius:15px;
    max-width:80%;
    line-height:1.4;
    font-size:14px;
}

.message.user{
    margin-left:auto;
    background:#111;
    color:white;
}

.message.ai{
    margin-right:auto;
    background:#e9e9e9;
    color:#111;
}

/* INPUT */

.inputArea{
    width:min(750px,92%);
    display:flex;
    gap:8px;
    margin-top:12px;
}

.input{
    flex:1;
    border:1px solid #ccc;
    background:white;
    border-radius:14px;
    padding:14px;
    outline:none;
    font-size:15px;
}

.input:focus{
    border-color:#111;
}

.send{
    width:52px;
    border:0;
    border-radius:14px;
    background:#111;
    color:white;
    font-size:18px;
}

/* CONTROLS */

.controls{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.control{
    width:48px;
    height:48px;
    border-radius:14px;
    border:1px solid #ccc;
    background:white;
    font-size:18px;
}

.control:hover{
    background:#eee;
}

.control.active{
    background:#111;
    color:white;
}

/* SIDE */

.side{
    width:240px;
    background:rgba(255,255,255,.75);
    border-left:1px solid #ddd;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.sideTitle{
    font-weight:800;
    margin-bottom:10px;
}

.action{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid #ddd;
    background:white;
    text-align:left;
    font-weight:600;
}

.action:hover{
    background:#eee;
}

/* LOGIN */

#userInfo{
    font-size:13px;
    color:#666;
    max-width:180px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

/* MOBILE */

@media(max-width:800px){

    .side{
        display:none;
    }

    .quotaBox{
        top:82px;
        left:10px;
        width:155px;
    }

    .orb{
        width:150px;
        height:150px;
    }

    .title{
        font-size:25px;
    }

    .topbar{
        padding:0 12px;
    }

    #userInfo{
        display:none;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="logo">
            NOVA <span>FAMILY AI</span>
        </div>

        <div class="top-right">

            <span id="userInfo">
                Nicht angemeldet
            </span>

            <button
                class="btn black"
                id="loginBtn">
                Google Login
            </button>

            <button
                class="btn"
                id="logoutBtn"
                style="display:none">
                Abmelden
            </button>

        </div>

    </header>


    <div class="quotaBox">

        <div class="quotaTitle">
            Gemini Fragen
        </div>

        <div id="quotaText">
            20 / 20
        </div>

        <div class="quotaBar">
            <div id="quotaFill"></div>
        </div>

        <div id="quotaStatus">
            Fragen verfügbar
        </div>

        <button id="quotaReset">
            Zähler zurücksetzen
        </button>

    </div>


    <main class="main">

        <section class="center">

            <div
                id="core"
                class="orb">
            </div>

            <div
                id="status"
                class="status">
                System bereit
            </div>

            <div class="title">
                Nova
            </div>


            <div
                id="chat"
                class="chat">
            </div>


            <div class="inputArea">

                <input
                    id="textInput"
                    class="input"
                    type="text"
                    placeholder="Frag Nova etwas..."
                    autocomplete="off">

                <button
                    id="sendBtn"
                    class="send">
                    ↑
                </button>

            </div>


            <div class="controls">

                <button
                    id="micBtn"
                    class="control"
                    title="Mikrofon">
                    🎙
                </button>

                <button
                    id="voiceBtn"
                    class="control"
                    title="Sprachmodus">
                    🔊
                </button>

                <button
                    id="testVoiceBtn"
                    class="control"
                    title="Stimme testen">
                    🔈
                </button>

            </div>

        </section>


        <aside class="side">

            <div class="sideTitle">
                Schnellzugriff
            </div>

            <button
                id="youtubeBtn"
                class="action">
                ▶ YouTube öffnen
            </button>

            <button
                id="googleBtn"
                class="action">
                🔎 Google öffnen
            </button>

            <button
                id="clearBtn"
                class="action">
                🗑 Chat löschen
            </button>

        </aside>

    </main>

</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAKmdUuFEfqmvs5gbjcdFhB1RIgC9EtrE",

    authDomain:
        "nova-68fc1.firebaseapp.com",

    projectId:
        "nova-68fc1",

    storageBucket:
        "nova-68fc1.firebasestorage.app",

    messagingSenderId:
        "1020069093020",

    appId:
        "1:1020069093020:web:9be72af9e60af659475759"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================
   ELEMENTS
========================================= */

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const userInfo =
    document.getElementById("userInfo");

const textInput =
    document.getElementById("textInput");

const sendBtn =
    document.getElementById("sendBtn");

const micBtn =
    document.getElementById("micBtn");

const voiceBtn =
    document.getElementById("voiceBtn");

const testVoiceBtn =
    document.getElementById("testVoiceBtn");

const youtubeBtn =
    document.getElementById("youtubeBtn");

const googleBtn =
    document.getElementById("googleBtn");

const clearBtn =
    document.getElementById("clearBtn");

const chat =
    document.getElementById("chat");

const status =
    document.getElementById("status");

const core =
    document.getElementById("core");

const quotaText =
    document.getElementById("quotaText");

const quotaFill =
    document.getElementById("quotaFill");

const quotaStatus =
    document.getElementById("quotaStatus");

const quotaReset =
    document.getElementById("quotaReset");


/* =========================================
   GEMINI
========================================= */

let model = null;

async function setupAI(){

    try{

        const aiModule =
            await import(
                "https://www.gstatic.com/firebasejs/12.13.0/firebase-ai.js"
            );

        const {
            getAI,
            getGenerativeModel,
            GoogleAIBackend
        } = aiModule;

        const ai =
            getAI(
                app,
                {
                    backend:
                        new GoogleAIBackend()
                }
            );

        model =
            getGenerativeModel(
                ai,
                {
                    model:
                        "gemini-3.7-flash"
                }
            );

        setState("System bereit");

    }catch(error){

        console.error(error);

        setState(
            "KI konnte nicht geladen werden"
        );

    }

}

setupAI();


/* =========================================
   QUOTA
========================================= */

const MAX_QUESTIONS = 20;

let questionsUsed =
    Number(
        localStorage.getItem(
            "nova_questions_used"
        ) || 0
    );

function updateQuota(){

    if(questionsUsed < 0)
        questionsUsed = 0;

    if(questionsUsed > MAX_QUESTIONS)
        questionsUsed = MAX_QUESTIONS;

    const remaining =
        MAX_QUESTIONS -
        questionsUsed;

    quotaText.textContent =
        `${remaining} / ${MAX_QUESTIONS}`;

    const percent =
        (questionsUsed /
        MAX_QUESTIONS) * 100;

    quotaFill.style.width =
        `${percent}%`;

    if(remaining === 0){

        quotaStatus.textContent =
            "Fragenlimit erreicht";

        quotaReset.style.display =
            "block";

    }else{

        quotaStatus.textContent =
            "Fragen verfügbar";

        quotaReset.style.display =
            "none";

    }

    localStorage.setItem(
        "nova_questions_used",
        questionsUsed
    );

}

function useQuestion(){

    if(
        questionsUsed >=
        MAX_QUESTIONS
    ){

        return false;

    }

    questionsUsed++;

    updateQuota();

    return true;

}

quotaReset.onclick = () => {

    questionsUsed = 0;

    updateQuota();

    setState(
        "Fragenzähler zurückgesetzt"
    );

};

updateQuota();


/* =========================================
   STATUS
========================================= */

function setState(text){

    status.textContent = text;

}


/* =========================================
   CHAT
========================================= */

function addMessage(
    text,
    type
){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        `message ${type}`;

    div.textContent =
        text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================
   VOICE
========================================= */

let voiceMode = false;

let isListening = false;

let isSpeaking = false;

let isThinking = false;

let recognition = null;

let micTimeout = null;

const MIC_MAX_TIME = 8000;


/* Speech Recognition */

if(
    "SpeechRecognition"
    in window
){

    recognition =
        new SpeechRecognition();

}else if(
    "webkitSpeechRecognition"
    in window
){

    recognition =
        new webkitSpeechRecognition();

}


if(recognition){

    recognition.lang =
        "de-DE";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.onstart = () => {

        isListening = true;

        micBtn.classList.add(
            "active"
        );

        core.classList.add(
            "listening"
        );

        setState(
            "Ich höre zu..."
        );

    };


    recognition.onresult =
        async event => {

            if(
                isSpeaking ||
                isThinking
            ){

                return;

            }

            const text =
                event
                .results[0][0]
                .transcript
                .trim();

            if(!text)
                return;

            textInput.value =
                text;

            stopListening();

            await askNova(text);

        };


    recognition.onerror =
        event => {

            console.warn(
                "Speech error:",
                event.error
            );

            stopListening();

            if(
                event.error !==
                "aborted"
            ){

                setState(
                    "Mikrofonfehler"
                );

            }

        };


    recognition.onend = () => {

        isListening = false;

        clearTimeout(
            micTimeout
        );

        micTimeout = null;

        micBtn.classList.remove(
            "active"
        );

        core.classList.remove(
            "listening"
        );

        if(
            !isSpeaking &&
            !isThinking
        ){

            if(voiceMode){

                setState(
                    "Sprachmodus bereit"
                );

            }else{

                setState(
                    "System bereit"
                );

            }

        }

    };

}


/* =========================================
   START LISTENING
========================================= */

function startListening(){

    if(!voiceMode)
        return;

    if(isSpeaking)
        return;

    if(isThinking)
        return;

    if(
        questionsUsed >=
        MAX_QUESTIONS
    ){

        setState(
            "Fragenlimit erreicht"
        );

        return;

    }

    if(!recognition){

        setState(
            "Sprache nicht unterstützt"
        );

        return;

    }

    try{

        clearTimeout(
            micTimeout
        );

        recognition.start();

        micTimeout =
            setTimeout(
                () => {

                    if(isListening){

                        stopListening();

                        setState(
                            "Mikrofon automatisch beendet"
                        );

                    }

                },
                MIC_MAX_TIME
            );

    }catch(error){

        console.warn(error);

    }

}


/* =========================================
   STOP LISTENING
========================================= */

function stopListening(){

    clearTimeout(
        micTimeout
    );

    micTimeout = null;

    if(!recognition)
        return;

    try{

        recognition.stop();

    }catch(error){

    }

    isListening = false;

    micBtn.classList.remove(
        "active"
    );

    core.classList.remove(
        "listening"
    );

}


/* =========================================
   SPEECH SYNTHESIS
========================================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }

    stopListening();

    speechSynthesis.cancel();

    isSpeaking = true;

    setState(
        "Nova spricht..."
    );

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "de-DE";

    utterance.rate =
        1;

    utterance.pitch =
        1;

    const voices =
        speechSynthesis.getVoices();

    const germanVoice =
        voices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith("de")
        );

    if(germanVoice){

        utterance.voice =
            germanVoice;

    }

    utterance.onend =
        () => {

            isSpeaking = false;

            if(voiceMode){

                setState(
                    "Sprachmodus bereit"
                );

                setTimeout(
                    () => {

                        if(
                            voiceMode &&
                            !isSpeaking &&
                            !isThinking
                        ){

                            startListening();

                        }

                    },
                    700
                );

            }else{

                setState(
                    "System bereit"
                );

            }

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================
   VOICE MODE
========================================= */

voiceBtn.onclick = () => {

    voiceMode =
        !voiceMode;

    voiceBtn.classList.toggle(
        "active",
        voiceMode
    );

    if(voiceMode){

        setState(
            "Sprachmodus aktiviert"
        );

        startListening();

    }else{

        stopListening();

        speechSynthesis.cancel();

        isSpeaking = false;

        setState(
            "Sprachmodus deaktiviert"
        );

    }

};


/* =========================================
   MICROPHONE BUTTON
========================================= */

micBtn.onclick = () => {

    if(isListening){

        stopListening();

        setState(
            "Mikrofon ausgeschaltet"
        );

        return;

    }

    if(!voiceMode){

        voiceMode = true;

        voiceBtn.classList.add(
            "active"
        );

    }

    startListening();

};


/* =========================================
   TEST VOICE
========================================= */

testVoiceBtn.onclick = () => {

    speak(
        "Hallo. Ich bin Nova. Das Sprachsystem funktioniert."
    );

};


/* =========================================
   ASK NOVA
========================================= */

async function askNova(text){

    text =
        text.trim();

    if(!text)
        return;

    if(isThinking)
        return;

    if(
        questionsUsed >=
        MAX_QUESTIONS
    ){

        setState(
            "Fragenlimit erreicht"
        );

        return;

    }

    addMessage(
        text,
        "user"
    );

    textInput.value = "";

    if(!useQuestion()){

        return;

    }

    isThinking = true;

    stopListening();

    setState(
        "Nova denkt..."
    );


    try{

        if(!model){

            throw new Error(
                "Gemini ist noch nicht geladen."
            );

        }


        const prompt = `

Du bist Nova, eine moderne persönliche KI.

Antworte immer auf Deutsch.

Antworte natürlich, freundlich und direkt.

Keine unnötig langen Antworten.

Du kannst normale Fragen beantworten.

Wenn der Benutzer ausdrücklich YouTube öffnen möchte,
antworte ausschließlich mit:

ACTION:youtube

Wenn der Benutzer ausdrücklich Google öffnen möchte,
antworte ausschließlich mit:

ACTION:google

Bei normalen Fragen antworte normal.

Benutzer:
${text}

`;


        const result =
            await model.generateContent(
                prompt
            );

        let answer =
            result
                .response
                .text()
                .trim();


        isThinking = false;


        /* ACTION YOUTUBE */

        if(
            answer
                .toLowerCase()
                .includes(
                    "action:youtube"
                )
        ){

            answer =
                "Ich öffne YouTube.";

            addMessage(
                answer,
                "ai"
            );

            speak(answer);

            window.open(
                "https://www.youtube.com/",
                "_blank"
            );

            return;

        }


        /* ACTION GOOGLE */

        if(
            answer
                .toLowerCase()
                .includes(
                    "action:google"
                )
        ){

            answer =
                "Ich öffne Google.";

            addMessage(
                answer,
                "ai"
            );

            speak(answer);

            window.open(
                "https://www.google.com/",
                "_blank"
            );

            return;

        }


        addMessage(
            answer,
            "ai"
        );

        speak(answer);


    }catch(error){

        console.error(error);

        isThinking = false;

        let errorText =
            "Es ist ein Fehler aufgetreten.";

        const message =
            String(
                error?.message ||
                error
            );


        if(
            message.includes("429")
        ){

            errorText =
                "Das Gemini-Fragenlimit wurde erreicht. Bitte später erneut versuchen.";

            questionsUsed =
                MAX_QUESTIONS;

            updateQuota();

        }else if(
            message.includes("401") ||
            message.includes("403")
        ){

            errorText =
                "Die Firebase- oder Gemini-Berechtigung ist nicht korrekt.";

        }else{

            errorText =
                "Nova konnte gerade keine Antwort erstellen.";

        }


        addMessage(
            errorText,
            "ai"
        );

        setState(
            "Fehler"
        );

        speak(errorText);

    }

}


/* =========================================
   SEND
========================================= */

sendBtn.onclick =
    () => {

        askNova(
            textInput.value
        );

    };


textInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            askNova(
                textInput.value
            );

        }

    }
);


/* =========================================
   YOUTUBE
========================================= */

youtubeBtn.onclick =
    () => {

        window.open(
            "https://www.youtube.com/",
            "_blank"
        );

    };


/* =========================================
   GOOGLE
========================================= */

googleBtn.onclick =
    () => {

        window.open(
            "https://www.google.com/",
            "_blank"
        );

    };


/* =========================================
   CLEAR CHAT
========================================= */

clearBtn.onclick =
    () => {

        chat.innerHTML = "";

        setState(
            "Chat gelöscht"
        );

    };


/* =========================================
   GOOGLE LOGIN
========================================= */

const provider =
    new GoogleAuthProvider();


loginBtn.onclick =
    async () => {

        try{

            setState(
                "Google Login..."
            );

            await signInWithPopup(
                auth,
                provider
            );

        }catch(error){

            console.error(error);

            setState(
                "Login fehlgeschlagen"
            );

        }

    };


/* =========================================
   LOGOUT
========================================= */

logoutBtn.onclick =
    async () => {

        try{

            await signOut(
                auth
            );

        }catch(error){

            console.error(error);

        }

    };


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(user){

            loginBtn.style.display =
                "none";

            logoutBtn.style.display =
                "block";

            userInfo.textContent =
                user.displayName ||
                user.email ||
                "Angemeldet";

            setState(
                "Angemeldet"
            );


            try{

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );

                const snapshot =
                    await getDoc(
                        userRef
                    );

                if(!snapshot.exists()){

                    await setDoc(
                        userRef,
                        {
                            name:
                                user.displayName ||
                                "",
                            email:
                                user.email ||
                                "",
                            createdAt:
                                Date.now()
                        }
                    );

                }

            }catch(error){

                console.warn(
                    "Firestore:",
                    error
                );

            }

        }else{

            loginBtn.style.display =
                "block";

            logoutBtn.style.display =
                "none";

            userInfo.textContent =
                "Nicht angemeldet";

            setState(
                "System bereit"
            );

        }

    }
);


/* =========================================
   INITIAL
========================================= */

setState(
    "System bereit"
);

</script>

</body>
</html>
