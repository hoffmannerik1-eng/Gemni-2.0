```html
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#020305">

    <title>Nova Family AI</title>

    <link rel="stylesheet" href="./style.css?v=10">
</head>

<body>

<div class="background"></div>


<header class="topbar">

    <div class="logo">

        <div class="logo-orb"></div>

        <div>
            <strong>NOVA</strong>
            <span>FAMILY AI</span>
        </div>

    </div>


    <div class="account">

        <img
            id="userPhoto"
            class="user-photo"
            hidden
            alt="Profilbild"
        >

        <div
            id="userInfo"
            class="user-info"
            hidden
        >
            <strong id="userName"></strong>
            <span id="userEmail"></span>
        </div>

        <button
            id="loginButton"
            class="login-button"
            type="button"
        >
            Mit Google anmelden
        </button>

        <button
            id="logoutButton"
            class="small-button"
            hidden
            type="button"
        >
            Abmelden
        </button>

    </div>

</header>


<main>

    <section class="assistant">

        <div
            id="orb"
            class="orb"
            aria-label="Nova"
        >

            <div class="orb-aura"></div>

            <div class="orb-shell">

                <div class="orb-surface"></div>

                <div class="orb-energy energy-one"></div>
                <div class="orb-energy energy-two"></div>

                <div class="orb-highlight"></div>

                <div class="orb-center"></div>

            </div>

        </div>


        <div class="status">

            <strong id="statusText">
                Nova wird geladen...
            </strong>

            <span id="statusSub">
                System wird gestartet
            </span>

        </div>


        <button
            id="microphone"
            class="microphone"
            type="button"
            disabled
        >
            🎙
        </button>


        <div class="mode-buttons">

            <button
                id="voiceMode"
                class="mode active"
                type="button"
            >
                Sprache
            </button>

            <button
                id="textMode"
                class="mode"
                type="button"
            >
                Text
            </button>

        </div>

    </section>


    <section
        id="textChat"
        class="chat"
        hidden
    >

        <div
            id="messages"
            class="messages"
        ></div>

        <div class="input-area">

            <input
                id="textInput"
                type="text"
                placeholder="Schreibe Nova etwas..."
                autocomplete="off"
                disabled
            >

            <button
                id="sendText"
                type="button"
                disabled
            >
                Senden
            </button>

        </div>

    </section>


    <section class="actions">

        <button
            id="youtubeButton"
            class="action-button"
            type="button"
        >
            YouTube
        </button>

        <button
            id="googleButton"
            class="action-button"
            type="button"
        >
            Google
        </button>

        <button
            id="settingsButton"
            class="action-button"
            type="button"
        >
            Einstellungen
        </button>

    </section>

</main>


<!-- SETTINGS -->

<div
    id="settingsOverlay"
    class="overlay"
    hidden
>

    <div class="settings">

        <div class="settings-header">

            <div>
                <h2>Nova Einstellungen</h2>
                <p>Nova konfigurieren</p>
            </div>

            <button
                id="closeSettings"
                class="close-button"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="setting">

            <label for="voiceSelect">
                Stimme
            </label>

            <select id="voiceSelect"></select>

        </div>


        <div class="setting">

            <label for="rateSlider">

                <span>Sprechgeschwindigkeit</span>

                <span id="rateValue">
                    1.0
                </span>

            </label>

            <input
                id="rateSlider"
                type="range"
                min="0.6"
                max="1.5"
                step="0.1"
                value="1"
            >

        </div>


        <div class="setting">

            <label for="volumeSlider">

                <span>Lautstärke</span>

                <span id="volumeValue">
                    100%
                </span>

            </label>

            <input
                id="volumeSlider"
                type="range"
                min="0"
                max="1"
                step="0.05"
                value="1"
            >

        </div>


        <div class="toggle-row">

            <label for="memoryToggle">
                Erinnerungen
            </label>

            <input
                id="memoryToggle"
                type="checkbox"
                checked
            >

        </div>


        <div class="toggle-row">

            <label for="animationToggle">
                Animationen
            </label>

            <input
                id="animationToggle"
                type="checkbox"
                checked
            >

        </div>


        <button
            id="testVoice"
            class="primary-button"
            type="button"
        >
            Stimme testen
        </button>


        <hr>


        <div class="family">

            <h3>Familie</h3>

            <p id="familyStatus">
                Keine Familie verbunden
            </p>

            <div class="family-actions">

                <button
                    id="createFamily"
                    class="secondary-button"
                    type="button"
                >
                    Familie erstellen
                </button>

                <input
                    id="familyCode"
                    type="text"
                    placeholder="Familiencode"
                >

                <button
                    id="joinFamily"
                    class="secondary-button"
                    type="button"
                >
                    Beitreten
                </button>

            </div>

        </div>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script
    type="module"
    src="./app.js?v=10"
></script>

</body>
</html>
```
