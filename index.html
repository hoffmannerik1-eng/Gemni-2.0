<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nova Family AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* LOGIN */

#loginScreen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#191919 0%,#080808 40%,#020202 100%);
    z-index:100;
}

.loginBox{
    width:min(430px,calc(100% - 30px));
    padding:40px 30px;
    border:1px solid #292929;
    border-radius:24px;
    background:#0b0b0b;
    text-align:center;
    box-shadow:0 0 80px rgba(255,255,255,.05);
}

.loginOrb{
    width:120px;
    height:120px;
    margin:0 auto 25px;
    border-radius:50%;
    background:
        radial-gradient(circle at 30% 25%,#fff,#aaa 20%,#333 55%,#050505 75%);
    box-shadow:0 0 45px rgba(255,255,255,.16);
    animation:breathe 3s infinite;
}

@keyframes breathe{
    50%{
        transform:scale(1.06);
        box-shadow:0 0 70px rgba(255,255,255,.25);
    }
}

.loginBox h1{
    font-size:32px;
    letter-spacing:5px;
}

.loginBox p{
    color:#888;
    line-height:1.5;
    margin:12px 0 25px;
}

#googleLogin{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    background:#fff;
    color:#000;
    font-weight:bold;
}

#loginError{
    color:#ff7070;
    font-size:13px;
    margin-top:15px;
}

/* HEADER */

header{
    height:70px;
    padding:0 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #222;
    background:rgba(5,5,5,.9);
}

.logo{
    font-size:21px;
    font-weight:bold;
    letter-spacing:3px;
}

.logo span{
    color:#777;
}

.headerRight{
    display:flex;
    align-items:center;
    gap:12px;
}

#userName{
    color:#888;
    font-size:13px;
}

#logoutBtn{
    background:#111;
    color:#fff;
    border:1px solid #333;
    padding:10px 14px;
    border-radius:10px;
}

/* MAIN */

main{
    width:min(1000px,100%);
    min-height:calc(100vh - 70px);
    margin:auto;
    padding:25px 18px 50px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#status{
    color:#777;
    min-height:20px;
    font-size:13px;
    text-align:center;
}

/* ORB */

.orbArea{
    height:350px;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

#orb{
    width:215px;
    height:215px;
    border-radius:50%;
    background:
        radial-gradient(circle at 32% 25%,#fff 0%,#ddd 8%,#777 25%,#222 58%,#030303 78%);
    box-shadow:
        0 0 40px rgba(255,255,255,.13),
        inset 0 0 50px rgba(255,255,255,.12);
    transition:.3s;
    position:relative;
}

#orb:before,
#orb:after{
    content:"";
    position:absolute;
    inset:-20px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:50%;
    animation:rotate 10s linear infinite;
}

#orb:after{
    inset:-35px;
    animation-direction:reverse;
    animation-duration:15s;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

#orb.listening{
    transform:scale(1.1);
    box-shadow:0 0 80px rgba(255,255,255,.3);
}

#orb.thinking{
    animation:think 1s infinite;
}

@keyframes think{
    50%{
        transform:scale(1.08);
    }
}

#orb.speaking{
    animation:speak .5s infinite;
}

@keyframes speak{
    50%{
        transform:scale(1.12);
    }
}

/* CHAT */

#chat{
    width:min(850px,100%);
    max-height:400px;
    overflow-y:auto;
    margin-bottom:15px;
}

.message{
    max-width:85%;
    padding:14px 17px;
    margin:8px 0;
    border-radius:16px;
    line-height:1.5;
    font-size:15px;
}

.message.user{
    margin-left:auto;
    background:#171717;
    border:1px solid #2b2b2b;
}

.message.nova{
    margin-right:auto;
    background:#0c0c0c;
    border:1px solid #222;
    color:#ddd;
}

/* INPUT */

.inputArea{
    width:min(850px,100%);
    display:flex;
    gap:8px;
}

#userInput{
    flex:1;
    min-width:0;
    background:#101010;
    color:#fff;
    border:1px solid #292929;
    border-radius:13px;
    padding:15px;
    outline:none;
}

#userInput:focus{
    border-color:#666;
}

.actionBtn{
    background:#111;
    color:#fff;
    border:1px solid #333;
    border-radius:13px;
    padding:0 15px;
    min-width:48px;
}

.sendBtn{
    background:#fff;
    color:#000;
    border-color:#fff;
    font-weight:bold;
}

/* CONTROLS */

.controls{
    width:min(850px,100%);
    display:flex;
    gap:8px;
    margin-top:10px;
}

.control{
    flex:1;
    padding:11px;
    background:#0d0d0d;
    color:#bbb;
    border:1px solid #252525;
    border-radius:10px;
}

.control.active{
    color:#fff;
    border-color:#888;
}

/* QUOTA */

.quota{
    width:min(850px,100%);
    margin-top:20px;
}

.quotaTop{
    display:flex;
    justify-content:space-between;
    color:#777;
    font-size:12px;
    margin-bottom:7px;
}

.quotaBar{
    height:5px;
    background:#181818;
    border-radius:10px;
    overflow:hidden;
}

#quotaFill{
    height:100%;
    width:0;
    background:#fff;
    transition:.3s;
}

@media(max-width:600px){

    header{
        padding:0 14px;
    }

    .logo{
        font-size:17px;
    }

    #userName{
        display:none;
    }

    .orbArea{
        height:290px;
    }

    #orb{
        width:170px;
        height:170px;
    }

    .controls{
        flex-wrap:wrap;
    }

    .control{
        min-width:30%;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="loginOrb"></div>

        <h1>NOVA</h1>

        <p>
            Deine persönliche Family AI.<br>
            Melde dich mit Google an.
        </p>

        <button id="googleLogin">
            Mit Google anmelden
        </button>

        <div id="loginError"></div>

    </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

<header>

    <div class="logo">
        NOVA <span>FAMILY AI</span>
    </div>

    <div class="headerRight">

        <span id="userName"></span>

        <button id="logoutBtn">
            Abmelden
        </button>

    </div>

</header>


<main>

    <div id="status">
        Nova ist bereit.
    </div>

    <div class="orbArea">
        <div id="orb"></div>
    </div>


    <div id="chat">

        <div class="message nova">
            Hallo. Ich bin Nova. Wie kann ich dir helfen?
        </div>

    </div>


    <div class="inputArea">

        <button id="micBtn" class="actionBtn">
            🎙
        </button>

        <input
            id="userInput"
            placeholder="Schreibe oder frage etwas..."
            autocomplete="off"
        >

        <button id="sendBtn" class="actionBtn sendBtn">
            →
        </button>

    </div>


    <div class="controls">

        <button id="voiceBtn" class="control active">
            Stimme: AN
        </button>

        <button id="youtubeBtn" class="control">
            YouTube
        </button>

        <button id="googleBtn" class="control">
            Google
        </button>

    </div>


    <div class="quota">

        <div class="quotaTop">

            <span>Fragen</span>

            <span id="quotaText">
                0 / 20
            </span>

        </div>

        <div class="quotaBar">
            <div id="quotaFill"></div>
        </div>

    </div>

</main>

</div>


<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyAKmdUuFEfqmvs5gbjcdFhB1RIg9C9EtrE",
    authDomain: "nova-68fc1.firebaseapp.com",
    projectId: "nova-68fc1",
    storageBucket: "nova-68fc1.firebasestorage.app",
    messagingSenderId: "1020069093020",
    appId: "1:1020069093020:web:9be72af9e60af659475759"
};


/* =========================================================
   FIREBASE
========================================================= */

let app;
let auth;
let db;
let model = null;

try{

    app = initializeApp(firebaseConfig);

    auth = getAuth(app);

    db = getFirestore(app);

}catch(error){

    console.error(error);

}


/* =========================================================
   ELEMENTE
========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const appScreen =
    document.getElementById("app");

const googleLogin =
    document.getElementById("googleLogin");

const loginError =
    document.getElementById("loginError");

const logoutBtn =
    document.getElementById("logoutBtn");

const userName =
    document.getElementById("userName");

const status =
    document.getElementById("status");

const orb =
    document.getElementById("orb");

const chat =
    document.getElementById("chat");

const userInput =
    document.getElementById("userInput");

const sendBtn =
    document.getElementById("sendBtn");

const micBtn =
    document.getElementById("micBtn");

const voiceBtn =
    document.getElementById("voiceBtn");

const youtubeBtn =
    document.getElementById("youtubeBtn");

const googleBtn =
    document.getElementById("googleBtn");

const quotaText =
    document.getElementById("quotaText");

const quotaFill =
    document.getElementById("quotaFill");


/* =========================================================
   GOOGLE LOGIN
========================================================= */

const provider =
    new GoogleAuthProvider();

provider.setCustomParameters({
    prompt:"select_account"
});


googleLogin.addEventListener(
    "click",
    async()=>{

        loginError.textContent = "";

        googleLogin.disabled = true;

        googleLogin.textContent =
            "Anmeldung...";

        try{

            await signInWithPopup(
                auth,
                provider
            );

        }catch(error){

            console.error(error);

            if(
                error.code ===
                "auth/api-key-not-valid"
            ){

                loginError.textContent =
                    "Firebase lehnt den API-Key ab. Bitte überprüfe den aktuellen Web-API-Key in Firebase.";

            }else if(
                error.code ===
                "auth/unauthorized-domain"
            ){

                loginError.textContent =
                    "Diese Website ist in Firebase noch nicht als autorisierte Domain eingetragen.";

            }else if(
                error.code ===
                "auth/popup-blocked"
            ){

                loginError.textContent =
                    "Der Browser hat das Google-Fenster blockiert.";

            }else{

                loginError.textContent =
                    "Anmeldung fehlgeschlagen: " +
                    error.message;

            }

        }finally{

            googleLogin.disabled = false;

            googleLogin.textContent =
                "Mit Google anmelden";

        }

    }
);


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async(user)=>{

        if(user){

            loginScreen.classList.add(
                "hidden"
            );

            appScreen.classList.remove(
                "hidden"
            );

            userName.textContent =
                user.displayName ||
                user.email ||
                "Benutzer";

            await createUserDocument(
                user
            );

            updateQuota();

        }else{

            loginScreen.classList.remove(
                "hidden"
            );

            appScreen.classList.add(
                "hidden"
            );

        }

    }
);


/* =========================================================
   FIRESTORE
========================================================= */

async function createUserDocument(user){

    if(!db) return;

    try{

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );

        const existing =
            await getDoc(userRef);

        if(!existing.exists()){

            await setDoc(
                userRef,
                {
                    name:
                        user.displayName || "",
                    email:
                        user.email || "",
                    createdAt:
                        new Date().toISOString()
                }
            );

        }

    }catch(error){

        console.error(
            "Firestore:",
            error
        );

    }

}


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
    "click",
    async()=>{

        await signOut(auth);

    }
);


/* =========================================================
   QUOTA
========================================================= */

const MAX_QUESTIONS = 20;

let questionsUsed =
    Number(
        localStorage.getItem(
            "nova_questions_used"
        ) || 0
    );


function updateQuota(){

    questionsUsed =
        Math.max(
            0,
            Math.min(
                MAX_QUESTIONS,
                questionsUsed
            )
        );

    quotaText.textContent =
        questionsUsed +
        " / " +
        MAX_QUESTIONS;

    quotaFill.style.width =
        (
            questionsUsed /
            MAX_QUESTIONS *
            100
        ) + "%";

}


function useQuestion(){

    if(
        questionsUsed >=
        MAX_QUESTIONS
    ){

        return false;

    }

    questionsUsed++;

    localStorage.setItem(
        "nova_questions_used",
        questionsUsed
    );

    updateQuota();

    return true;

}

updateQuota();


/* =========================================================
   GEMINI
========================================================= */

async function initializeAI(){

    if(model){
        return true;
    }

    try{

        const aiModule =
            await import(
                "https://www.gstatic.com/firebasejs/12.13.0/firebase-ai.js"
            );

        const {
            getAI,
            getGenerativeModel,
            GoogleAIBackend
        } = aiModule;

        const ai =
            getAI(
                app,
                {
                    backend:
                        new GoogleAIBackend()
                }
            );

        model =
            getGenerativeModel(
                ai,
                {
                    model:
                        "gemini-3.7-flash"
                }
            );

        return true;

    }catch(error){

        console.error(error);

        return false;

    }

}


/* =========================================================
   CHAT
========================================================= */

function addMessage(
    text,
    type
){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message " + type;

    div.textContent =
        text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   ORB
========================================================= */

function setOrb(mode){

    orb.classList.remove(
        "listening",
        "thinking",
        "speaking"
    );

    if(mode){

        orb.classList.add(
            mode
        );

    }

}


/* =========================================================
   WEB-AKTIONEN
========================================================= */

/*
    Diese Funktion erkennt Suchbefehle.

    Beispiele:

    "Öffne auf Google Minecraft"
    "Such auf YouTube Minecraft"
    "Zeig mir Bilder vom Kölner Dom"
    "Wo ist der Kölner Dom?"
    "Zeig mir Videos vom Kölner Dom"
    "Öffne Wikipedia über Albert Einstein"
    "Öffne Google Maps Kölner Dom"
*/

function detectWebAction(text){

    const original =
        text.trim();

    const lower =
        original.toLowerCase();


    /* -----------------------------------------
       YOUTUBE
    ----------------------------------------- */

    if(
        lower.includes("youtube")
    ){

        let query =
            original
                .replace(
                    /.*youtube/i,
                    ""
                )
                .replace(
                    /^(nach|für|zu|über|suche|such|öffne)\s*/i,
                    ""
                )
                .trim();

        if(
            query &&
            query.length > 1
        ){

            return {
                type:"youtube-search",
                query
            };

        }

        return {
            type:"youtube",
            query:""
        };

    }


    /* -----------------------------------------
       GOOGLE BILDER
    ----------------------------------------- */

    if(
        lower.includes("bilder") ||
        lower.includes("bild von") ||
        lower.includes("bilder von") ||
        lower.includes("bilder über")
    ){

        let query =
            original
                .replace(
                    /zeig(e)?\s+mir\s+/i,
                    ""
                )
                .replace(
                    /bilder?\s+(von|über)\s*/i,
                    ""
                )
                .trim();

        if(!query){

            query = original;

        }

        return {
            type:"google-images",
            query
        };

    }


    /* -----------------------------------------
       GOOGLE MAPS
    ----------------------------------------- */

    if(
        lower.includes("google maps") ||
        lower.includes("maps") ||
        lower.includes("karte von") ||
        lower.includes("wo ist")
    ){

        let query =
            original
                .replace(
                    /google maps/i,
                    ""
                )
                .replace(
                    /wo ist/i,
                    ""
                )
                .replace(
                    /karte von/i,
                    ""
                )
                .trim();

        if(query){

            return {
                type:"maps",
                query
            };

        }

    }


    /* -----------------------------------------
       VIDEOS
    ----------------------------------------- */

    if(
        lower.includes("videos von") ||
        lower.includes("video von") ||
        lower.includes("videos über") ||
        lower.includes("video über")
    ){

        let query =
            original
                .replace(
                    /.*videos?\s+(von|über)\s*/i,
                    ""
                )
                .trim();

        return {
            type:"youtube-search",
            query
        };

    }


    /* -----------------------------------------
       WIKIPEDIA
    ----------------------------------------- */

    if(
        lower.includes("wikipedia")
    ){

        let query =
            original
                .replace(
                    /.*wikipedia/i,
                    ""
                )
                .replace(
                    /^(über|zu|von|nach)\s*/i,
                    ""
                )
                .trim();

        return {
            type:"wikipedia",
            query
        };

    }


    /* -----------------------------------------
       GOOGLE SUCHE
    ----------------------------------------- */

    if(
        lower.includes("auf google") ||
        lower.includes("bei google") ||
        lower.startsWith("google ")
    ){

        let query =
            original
                .replace(
                    /.*?(auf|bei)\s+google/i,
                    ""
                )
                .replace(
                    /^google\s+/i,
                    ""
                )
                .replace(
                    /^(nach|über|zu)\s+/i,
                    ""
                )
                .trim();

        return {
            type:"google-search",
            query
        };

    }


    /* -----------------------------------------
       ALLGEMEINE FRAGE:
       "Wo ist der Kölner Dom?"
    ----------------------------------------- */

    if(
        lower.startsWith("wo ist ") ||
        lower.startsWith("wo befindet sich ")
    ){

        let query =
            original
                .replace(
                    /^wo ist\s+/i,
                    ""
                )
                .replace(
                    /^wo befindet sich\s+/i,
                    ""
                )
                .trim();

        return {
            type:"google-search",
            query
        };

    }


    return null;

}


/* =========================================================
   URL ÖFFNEN
========================================================= */

function openWebAction(action){

    if(!action){
        return false;
    }


    const query =
        action.query || "";


    const encoded =
        encodeURIComponent(
            query
        );


    switch(action.type){

        case "google-search":

            window.open(
                "https://www.google.com/search?q=" +
                encoded,
                "_blank"
            );

            return true;


        case "google-images":

            window.open(
                "https://www.google.com/search?tbm=isch&q=" +
                encoded,
                "_blank"
            );

            return true;


        case "youtube-search":

            if(query){

                window.open(
                    "https://www.youtube.com/results?search_query=" +
                    encoded,
                    "_blank"
                );

            }else{

                window.open(
                    "https://www.youtube.com/",
                    "_blank"
                );

            }

            return true;


        case "youtube":

            window.open(
                "https://www.youtube.com/",
                "_blank"
            );

            return true;


        case "wikipedia":

            window.open(
                "https://de.wikipedia.org/w/index.php?search=" +
                encoded,
                "_blank"
            );

            return true;


        case "maps":

            window.open(
                "https://www.google.com/maps/search/?api=1&query=" +
                encoded,
                "_blank"
            );

            return true;

    }

    return false;

}


/* =========================================================
   NOVA
========================================================= */

async function askNova(question){

    question =
        question.trim();

    if(!question){
        return;
    }


    /* -----------------------------------------
       WEB-BEFEHL ZUERST PRÜFEN
    ----------------------------------------- */

    const webAction =
        detectWebAction(
            question
        );


    /*
       Direkte Website-Aktion:

       Dadurch muss Gemini nicht erst
       entscheiden, ob Google/YouTube
       geöffnet werden soll.
    */

    if(webAction){

        addMessage(
            question,
            "user"
        );

        if(
            webAction.type ===
            "google-images"
        ){

            addMessage(
                "Ich öffne die passenden Bilder.",
                "nova"
            );

        }else if(
            webAction.type ===
            "youtube-search"
        ){

            addMessage(
                "Ich suche das auf YouTube.",
                "nova"
            );

        }else if(
            webAction.type ===
            "maps"
        ){

            addMessage(
                "Ich öffne den Ort in Google Maps.",
                "nova"
            );

        }else if(
            webAction.type ===
            "wikipedia"
        ){

            addMessage(
                "Ich öffne die passende Wikipedia-Suche.",
                "nova"
            );

        }else{

            addMessage(
                "Ich öffne die passende Google-Suche.",
                "nova"
            );

        }

        openWebAction(
            webAction
        );

        speak(
            webAction.type === "youtube-search"
                ? "Ich suche das auf YouTube."
                : webAction.type === "google-images"
                    ? "Ich öffne die passenden Bilder."
                    : webAction.type === "maps"
                        ? "Ich öffne den Ort in Google Maps."
                        : "Ich öffne die passende Suche."
        );

        return;

    }


    /* -----------------------------------------
       NORMALE KI-FRAGE
    ----------------------------------------- */

    if(
        questionsUsed >=
        MAX_QUESTIONS
    ){

        addMessage(
            "Das lokale Fragenlimit von 20 Fragen wurde erreicht.",
            "nova"
        );

        return;

    }


    if(!useQuestion()){
        return;
    }


    addMessage(
        question,
        "user"
    );


    userInput.value = "";


    setStatus(
        "Nova denkt..."
    );

    setOrb(
        "thinking"
    );


    const ready =
        await initializeAI();


    if(!ready){

        addMessage(
            "Die KI konnte nicht initialisiert werden.",
            "nova"
        );

        setOrb(null);

        return;

    }


    try{

        const systemPrompt = `

Du bist Nova, eine moderne persönliche KI.

Antworte auf Deutsch, wenn der Benutzer Deutsch spricht.

Sei freundlich, intelligent und direkt.

Beantworte normale Fragen.

Wichtig:
Wenn der Benutzer nach einer Information fragt,
sollst du die Frage normal beantworten.

Der Browser kann Webseiten direkt über JavaScript öffnen.
Direkte Website-Befehle werden bereits vor deiner Antwort
erkannt.

`;

        const result =
            await model.generateContent(
                systemPrompt +
                "\n\nBenutzer:\n" +
                question
            );


        const answer =
            result.response.text();


        addMessage(
            answer,
            "nova"
        );


        speak(
            answer
        );


    }catch(error){

        console.error(error);

        let text =
            "Es ist ein Fehler aufgetreten.";


        if(
            error.message &&
            error.message.includes("429")
        ){

            text =
                "Das Gemini-Limit wurde erreicht. Bitte später erneut versuchen.";

        }else if(
            error.message &&
            error.message
                .toLowerCase()
                .includes("api key")
        ){

            text =
                "Der Firebase API-Key wird abgelehnt.";

        }else if(
            error.message
        ){

            text =
                error.message;

        }


        addMessage(
            text,
            "nova"
        );

    }finally{

        setOrb(null);

        setStatus(
            "Nova ist bereit."
        );

    }

}

/* =========================================================
   SPRACH-AUSGABE
========================================================= */

let isSpeaking = false;
let voiceMode = true;


function speak(text){

    if(!voiceMode){
        return;
    }


    if(
        !("speechSynthesis" in window)
    ){
        return;
    }


    stopListening();

    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "de-DE";

    utterance.rate =
        1;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    const voices =
        speechSynthesis.getVoices();


    const german =
        voices.find(
            v =>
                v.lang &&
                v.lang
                    .toLowerCase()
                    .startsWith("de")
        );


    if(german){

        utterance.voice =
            german;

    }


    isSpeaking = true;

    setOrb(
        "speaking"
    );

    setStatus(
        "Nova spricht..."
    );


    utterance.onend =
        ()=>{

            isSpeaking = false;

            setOrb(null);

            setStatus(
                "Nova ist bereit."
            );


            if(voiceMode){

                setTimeout(
                    ()=>{
                        startListening();
                    },
                    700
                );

            }

        };


    utterance.onerror =
        ()=>{

            isSpeaking = false;

            setOrb(null);

            setStatus(
                "Nova ist bereit."
            );

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   SPRACHERKENNUNG
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;
let micTimeout = null;

const MIC_MAX_TIME =
    8000;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "de-DE";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        ()=>{

            isListening = true;

            setOrb(
                "listening"
            );

            setStatus(
                "Ich höre zu..."
            );


            clearTimeout(
                micTimeout
            );


            micTimeout =
                setTimeout(
                    ()=>{
                        stopListening();
                    },
                    MIC_MAX_TIME
                );

        };


    recognition.onresult =
        event=>{

            clearTimeout(
                micTimeout
            );


            const text =
                event.results[0][0]
                    .transcript;


            stopListening();


            if(text.trim()){

                askNova(
                    text
                );

            }

        };


    recognition.onend =
        ()=>{

            clearTimeout(
                micTimeout
            );

            isListening = false;

            setOrb(null);

            if(!isSpeaking){

                setStatus(
                    "Nova ist bereit."
                );

            }

        };


    recognition.onerror =
        event=>{

            clearTimeout(
                micTimeout
            );

            isListening = false;

            setOrb(null);

            console.error(
                "Speech:",
                event.error
            );

        };

}


/* =========================================================
   LISTENING
========================================================= */

function startListening(){

    if(!recognition){

        setStatus(
            "Dieser Browser unterstützt keine Spracherkennung."
        );

        return;

    }


    if(isSpeaking){
        return;
    }


    if(isListening){
        return;
    }


    try{

        recognition.start();

    }catch(error){

        console.error(error);

    }

}


function stopListening(){

    clearTimeout(
        micTimeout
    );


    if(
        recognition &&
        isListening
    ){

        try{

            recognition.stop();

        }catch(error){

            console.error(error);

        }

    }


    isListening = false;

    setOrb(null);

}

   MIC BUTTON
========================================================= */

micBtn.addEventListener(

    ()=>{

        if(isListening){

            stopListening();

        }else{

        }

    }
);

                : "Stimme: AUS";

            "active",
            voiceMode

            speechSynthesis.cancel();

            stopListening();

            setStatus(

            );

    }
);
