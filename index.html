<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#050505">

    <title>Nova Family AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<header class="topbar">

    <div class="logo">
        <div class="logo-orb"></div>

        <div>
            <strong>NOVA</strong>
            <span>Family AI</span>
        </div>
    </div>

    <div class="account">

        <img id="userPhoto"
             class="user-photo"
             alt=""
             hidden>

        <div id="userInfo"
             class="user-info"
             hidden>

            <strong id="userName"></strong>
            <span id="userEmail"></span>

        </div>

        <button id="loginButton"
                class="login-button">
            Mit Google anmelden
        </button>

        <button id="logoutButton"
                class="small-button"
                hidden>
            Abmelden
        </button>

    </div>

</header>


<main>

    <section class="assistant">

        <div id="orb"
             class="orb">

            <div class="orb-inner"></div>

            <div class="orb-ring ring1"></div>
            <div class="orb-ring ring2"></div>
            <div class="orb-ring ring3"></div>

        </div>


        <div id="status"
             class="status">

            <strong id="statusText">
                Bitte anmelden
            </strong>

            <span id="statusSub">
                Nova wartet
            </span>

        </div>


        <button id="microphone"
                class="microphone"
                disabled>

            <span>🎙</span>

        </button>


        <div class="mode-buttons">

            <button id="voiceMode"
                    class="mode active">
                Sprache
            </button>

            <button id="textMode"
                    class="mode">
                Text
            </button>

        </div>

    </section>


    <section id="textChat"
             class="chat"
             hidden>

        <div id="messages"
             class="messages">

        </div>

        <div class="input-area">

            <input id="textInput"
                   type="text"
                   autocomplete="off"
                   placeholder="Schreibe Nova etwas..."
                   disabled>

            <button id="sendText"
                    disabled>
                Senden
            </button>

        </div>

    </section>


    <section class="actions">

        <button id="youtubeButton"
                class="action-button"
                disabled>
            YouTube
        </button>

        <button id="googleButton"
                class="action-button"
                disabled>
            Google
        </button>

        <button id="settingsButton"
                class="action-button">
            Einstellungen
        </button>

    </section>

</main>


<!-- SETTINGS -->

<div id="settingsOverlay"
     class="overlay"
     hidden>

    <div class="settings">

        <div class="settings-header">

            <div>
                <h2>Nova Einstellungen</h2>
                <p>Deine persönlichen Einstellungen</p>
            </div>

            <button id="closeSettings"
                    class="close-button">
                ×
            </button>

        </div>


        <div class="setting">

            <label>
                Stimme
            </label>

            <select id="voiceSelect"></select>

        </div>


        <div class="setting">

            <label>
                Sprechgeschwindigkeit

                <span id="rateValue">
                    1.0
                </span>

            </label>

            <input id="rateSlider"
                   type="range"
                   min="0.6"
                   max="1.5"
                   step="0.1"
                   value="1">

        </div>


        <div class="setting">

            <label>
                Lautstärke

                <span id="volumeValue">
                    100%
                </span>

            </label>

            <input id="volumeSlider"
                   type="range"
                   min="0"
                   max="1"
                   step="0.05"
                   value="1">

        </div>


        <div class="setting toggle-row">

            <label>
                Erinnerungen
            </label>

            <input id="memoryToggle"
                   type="checkbox"
                   checked>

        </div>


        <div class="setting toggle-row">

            <label>
                Animationen
            </label>

            <input id="animationToggle"
                   type="checkbox"
                   checked>

        </div>


        <button id="testVoice"
                class="primary-button">
            Stimme testen
        </button>


        <hr>


        <div class="family">

            <h3>Familie</h3>

            <p id="familyStatus">
                Keine Familie verbunden
            </p>

            <div class="family-actions">

                <button id="createFamily"
                        class="secondary-button">
                    Familie erstellen
                </button>

                <input id="familyCode"
                       placeholder="Familiencode">

                <button id="joinFamily"
                        class="secondary-button">
                    Beitreten
                </button>

            </div>

        </div>


        <div id="memoryStatus"
             class="memory-status">

        </div>

    </div>

</div>


<div id="toast"
     class="toast">
</div>


<script type="module" src="./app.js"></script>

</body>
</html>
