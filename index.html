<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nova Family AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#000;
    color:#fff;
    min-height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(circle at 50% 35%,#202020 0%,#080808 45%,#000 100%);
}

/* HEADER */

header{
    height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid #252525;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(20px);
    z-index:5;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:20px;
    font-weight:700;
    letter-spacing:-.5px;
}

.logoDot{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#fff;
    position:relative;
    box-shadow:0 0 25px rgba(255,255,255,.2);
}

.logoDot:after{
    content:"";
    position:absolute;
    width:9px;
    height:9px;
    background:#000;
    border-radius:50%;
    top:12px;
    left:12px;
}

.headerRight{
    display:flex;
    align-items:center;
    gap:10px;
}

button{
    font-family:inherit;
    cursor:pointer;
    border:none;
}

.headerBtn{
    padding:10px 16px;
    border-radius:12px;
    background:#fff;
    color:#000;
    font-weight:600;
    transition:.2s;
}

.headerBtn:hover{
    transform:translateY(-1px);
    background:#ddd;
}

.headerBtn.light{
    background:#111;
    color:#fff;
    border:1px solid #333;
}

/* QUOTA */

.quotaBox{
    position:fixed;
    top:88px;
    left:18px;
    width:235px;
    padding:14px 16px;
    background:rgba(12,12,12,.94);
    border:1px solid #292929;
    border-radius:16px;
    box-shadow:0 10px 35px rgba(0,0,0,.5);
    backdrop-filter:blur(18px);
    z-index:20;
}

.quotaTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    color:#fff;
    font-size:13px;
    margin-bottom:9px;
}

.quotaTitle{
    font-weight:650;
}

#quotaText{
    font-weight:800;
    font-size:13px;
}

.quotaBar{
    width:100%;
    height:8px;
    background:#292929;
    border-radius:20px;
    overflow:hidden;
}

#quotaFill{
    width:100%;
    height:100%;
    background:#fff;
    border-radius:20px;
    transition:width .35s ease;
}

#quotaStatus{
    margin-top:7px;
    color:#888;
    font-size:11px;
}

#quotaReset{
    margin-top:9px;
    display:none;
    width:100%;
    padding:7px 10px;
    border-radius:9px;
    background:#fff;
    color:#000;
    font-size:11px;
    font-weight:600;
}

/* MAIN */

main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:0;
}

.coreArea{
    flex:0 0 43%;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
}

.core{
    width:180px;
    height:180px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 28%,
        #ffffff 0%,
        #ffffff 38%,
        #eeeeee 62%,
        #cfcfcf 82%,
        #999 100%);
    box-shadow:
        0 0 35px rgba(255,255,255,.18),
        0 25px 70px rgba(0,0,0,.8),
        inset 0 0 30px rgba(255,255,255,.9);
    position:relative;
    transition:.35s;
}

.core:before{
    content:"";
    position:absolute;
    inset:-18px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.18);
}

.core:after{
    content:"";
    position:absolute;
    inset:-35px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.07);
}

.core.listening{
    transform:scale(1.07);
    box-shadow:
        0 0 55px rgba(255,255,255,.35),
        0 25px 70px rgba(0,0,0,.8),
        inset 0 0 30px rgba(255,255,255,1);
}

.core.thinking{
    animation:pulse 1.1s infinite;
}

.core.speaking{
    animation:speakPulse .75s infinite alternate;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
}

@keyframes speakPulse{
    from{transform:scale(1)}
    to{transform:scale(1.055)}
}

.coreCenter{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    font-weight:800;
    color:#000;
    letter-spacing:-2px;
}

.status{
    margin-top:30px;
    font-size:13px;
    color:#777;
    letter-spacing:.8px;
    text-transform:uppercase;
}

.title{
    margin-top:8px;
    font-size:30px;
    font-weight:750;
    letter-spacing:-1.5px;
}

.chat{
    width:min(900px,calc(100% - 32px));
    flex:1;
    min-height:150px;
    overflow-y:auto;
    padding:10px 0 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:75%;
    padding:13px 16px;
    border-radius:18px;
    line-height:1.45;
    font-size:15px;
}

.message.user{
    align-self:flex-end;
    background:#fff;
    color:#000;
    border-bottom-right-radius:5px;
}

.message.nova{
    align-self:flex-start;
    background:#111;
    color:#fff;
    border:1px solid #292929;
    border-bottom-left-radius:5px;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.bottom{
    width:min(900px,calc(100% - 32px));
    margin:0 auto 22px;
}

.inputBox{
    display:flex;
    align-items:center;
    gap:10px;
    background:#0d0d0d;
    border:1px solid #303030;
    border-radius:20px;
    padding:8px;
    box-shadow:0 10px 35px rgba(0,0,0,.5);
}

#input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    padding:13px;
    font-size:15px;
    color:#fff;
}

#input::placeholder{
    color:#777;
}

.iconBtn{
    width:45px;
    height:45px;
    border-radius:14px;
    background:#1d1d1d;
    color:#fff;
    font-size:18px;
}

.iconBtn.active{
    background:#fff;
    color:#000;
}

.sendBtn{
    width:45px;
    height:45px;
    border-radius:14px;
    background:#fff;
    color:#000;
    font-size:18px;
}

.tools{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:10px;
}

.toolBtn{
    background:#111;
    border:1px solid #292929;
    padding:8px 12px;
    border-radius:10px;
    color:#aaa;
    font-size:12px;
}

.toolBtn:hover{
    background:#1c1c1c;
    color:#fff;
}

/* LOGIN */

.loginOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.97);
    backdrop-filter:blur(20px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
}

.loginCard{
    width:min(420px,calc(100% - 40px));
    background:#0c0c0c;
    border:1px solid #292929;
    border-radius:25px;
    padding:38px;
    text-align:center;
    box-shadow:0 30px 90px rgba(0,0,0,.8);
}

.loginCard h1{
    font-size:32px;
    margin-bottom:10px;
}

.loginCard p{
    color:#777;
    margin-bottom:25px;
}

.googleLogin{
    width:100%;
    padding:14px;
    border-radius:14px;
    background:#fff;
    color:#000;
    font-size:15px;
    font-weight:650;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:0 16px;
        height:64px;
    }

    .logo{
        font-size:17px;
    }

    .headerBtn{
        padding:8px 11px;
        font-size:12px;
    }

    .quotaBox{
        top:74px;
        left:10px;
        width:185px;
        padding:11px 12px;
    }

    .core{
        width:135px;
        height:135px;
    }

    .coreCenter{
        font-size:25px;
    }

    .title{
        font-size:25px;
    }

    .message{
        max-width:88%;
    }
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="logo">
        <div class="logoDot"></div>
        NOVA
    </div>

    <div class="headerRight">

        <button class="headerBtn light" id="voiceModeButton">
            Sprache
        </button>

        <button class="headerBtn" id="loginButton">
            Anmelden
        </button>

        <button class="headerBtn light"
                id="logoutButton"

        </button>

    </div>

</header>

<div class="quotaBox">

    <div class="quotaTop">

</main>
</div>

<div class="loginOverlay" id="loginOverlay">

    <div class="loginCard">

        <div class="logo"
             style="justify-content:center;margin-bottom:20px">

            <div class="logoDot"></div>
            NOVA

        </div>

        <h1>
            Nova Family AI
        </h1>

        <p>
            Deine persönliche KI.
        </p>

        <button class="googleLogin" id="googleLogin">
            Mit Google anmelden
        </button>

    </div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAKmdUuFEfqmvs5gbjcdFhB1RIgC9EtrE",

    authDomain:
        "nova-68fc1.firebaseapp.com",

    projectId:
        "nova-68fc1",

    storageBucket:
        "nova-68fc1.firebasestorage.app",

    messagingSenderId:
        "1020069093020",

    appId:
        "1:1020069093020:web:9be72af9e60af659475759"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const provider =
    new GoogleAuthProvider();


const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const state =
    document.getElementById("state");

const core =
    document.getElementById("core");

const micButton =
    document.getElementById("micButton");

const sendButton =
    document.getElementById("sendButton");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const googleLogin =
    document.getElementById("googleLogin");

const loginOverlay =
    document.getElementById("loginOverlay");

const voiceModeButton =
    document.getElementById("voiceModeButton");

const youtubeButton =
    document.getElementById("youtubeButton");

const googleButton =
    document.getElementById("googleButton");

const testVoiceButton =
    document.getElementById("testVoiceButton");

const MAX_QUESTIONS = 20;

const quotaText =
    document.getElementById("quotaText");

const quotaFill =
    document.getElementById("quotaFill");

const quotaStatus =
    document.getElementById("quotaStatus");

const quotaReset =
    document.getElementById("quotaReset");


let questionsUsed =
    Number(
        localStorage.getItem(
            "nova_questions_used"
        ) || 0
    );


function updateQuota(){

    const remaining =
        Math.max(
            0,
            MAX_QUESTIONS - questionsUsed
        );

    quotaText.textContent =
        `${remaining} / ${MAX_QUESTIONS}`;

    const percentage =
        (remaining / MAX_QUESTIONS) * 100;

    quotaFill.style.width =
        percentage + "%";

    if(remaining <= 0){

        quotaStatus.textContent =
            "Limit erreicht";

        quotaReset.style.display =
            "block";

    }else if(remaining <= 5){

        quotaStatus.textContent =
            "Nur noch wenige Fragen";

        quotaReset.style.display =
            "none";

    }else{

        quotaStatus.textContent =
            "Bereit";

        quotaReset.style.display =
            "none";

    }

}


function useQuestion(){

    if(
        questionsUsed >=
        MAX_QUESTIONS
    ){

        return false;

    }

    questionsUsed++;

    localStorage.setItem(
        "nova_questions_used",
        questionsUsed
    );

    updateQuota();

    return true;
}


quotaReset.onclick =
    () => {

        questionsUsed = 0;

        localStorage.setItem(
            "nova_questions_used",
            "0"
        );

        updateQuota();

        setState(
            "Fragenzähler zurückgesetzt"
        );

    };


updateQuota();


let model = null;

let currentUser = null;

let isListening = false;

let isSpeaking = false;

let isThinking = false;

let voiceMode = true;

let recognition = null;

let retryTimer = null;

/* NEU: Mikrofon-Timer */

let micTimeout = null;

const MIC_MAX_TIME = 8000;


function addMessage(text,type){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;
}


function setState(text){

    state.textContent =
        text;
}


/* =====================================================
   MIKROFON STOPPEN
===================================================== */

function stopListening(){

    clearTimeout(
        micTimeout
    );

    micTimeout = null;

    if(!recognition)
        return;

    try{

        recognition.stop();

    }catch(e){}

    isListening = false;

    micButton.classList.remove(
        "active"
    );

    core.classList.remove(
        "listening"
    );

}


/* =====================================================
   NOVA SPRICHT
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }

    stopListening();

    speechSynthesis.cancel();

    isSpeaking = true;

    core.classList.remove(
        "listening"
    );

    core.classList.remove(
        "thinking"
    );

    core.classList.add(
        "speaking"
    );

    setState(
        "Nova spricht"
    );

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "de-DE";

    utterance.rate =
        0.95;

    utterance.pitch =
        1;

    utterance.volume =
        1;

    const voices =
        speechSynthesis.getVoices();

    const germanVoice =
        voices.find(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("de")
        );

    if(germanVoice){

        utterance.voice =
            germanVoice;

    }

    utterance.onend =
        () => {

            isSpeaking = false;

            core.classList.remove(
                "speaking"
            );

            setState(
                voiceMode
                    ? "Bereit"
                    : "Textmodus"
            );

            if(
                voiceMode &&
                !isThinking
            ){

                setTimeout(
                    startListening,
                    700
                );

            }

        };

    utterance.onerror =
        () => {

            isSpeaking = false;

            core.classList.remove(
                "speaking"
            );

            setState(
                "Bereit"
            );

        };

    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   SPRACHERKENNUNG
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "de-DE";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        () => {

            if(
                isSpeaking ||
                isThinking
            ){

                stopListening();

                return;

            }

            isListening = true;

            core.classList.add(
                "listening"
            );

            micButton.classList.add(
                "active"
            );

            setState(
                "Ich höre zu"
            );

            /* =================================================
               AUTOMATISCH NACH 8 SEKUNDEN AUS
            ================================================= */

            clearTimeout(
                micTimeout
            );

            micTimeout =
                setTimeout(
                    () => {

                        if(isListening){

                            stopListening();

                            setState(
                                "Mikrofon automatisch beendet"
                            );

                        }

                    },
                    MIC_MAX_TIME
                );

        };


    recognition.onend =
        () => {

            clearTimeout(
                micTimeout
            );

            micTimeout = null;

            isListening = false;

            micButton.classList.remove(
                "active"
            );

            core.classList.remove(
                "listening"
            );

            if(
                !isSpeaking &&
                !isThinking
            ){

                setState(
                    voiceMode
                        ? "Bereit"
                        : "Textmodus"
                );

            }

        };


    recognition.onerror =
        event => {

            clearTimeout(
                micTimeout
            );

            micTimeout = null;

            console.log(
                "Speech:",
                event.error
            );

            isListening = false;

            micButton.classList.remove(
                "active"
            );

            core.classList.remove(
                "listening"
            );

        };


    recognition.onresult =
        event => {

            if(
                isSpeaking ||
                isThinking
            )
                return;

            clearTimeout(
                micTimeout
            );

            micTimeout = null;

            const text =
                event
                    .results[0][0]
                    .transcript;

            input.value =
                text;

            sendMessage();

        };

}


/* =====================================================
   ZUHÖREN STARTEN
===================================================== */

function startListening(){

    if(!voiceMode)
        return;

    if(isSpeaking)
        return;

    if(isThinking)
        return;

    if(
        questionsUsed >=
        MAX_QUESTIONS
    ){

        setState(
            "Fragenlimit erreicht"
        );

        return;

    }

    if(!recognition){

        setState(
            "Sprache nicht unterstützt"
        );

        return;

    }

    try{

        clearTimeout(
            micTimeout
        );

        recognition.start();

    }catch(e){}

}


/* =====================================================
   FIREBASE AI
===================================================== */

async function setupAI(){

    try{

        setState(
            "KI wird geladen"
        );

        const aiModule =
            await import(
                "https://www.gstatic.com/firebasejs/12.13.0/firebase-ai.js"
            );

        const {
            getAI,
            getGenerativeModel,
            GoogleAIBackend
        } = aiModule;

        const ai =
            getAI(
                app,
                {
                    backend:
                        new GoogleAIBackend()
                }
            );

        model =
            getGenerativeModel(
                ai,
                {
                    model:
                        "gemini-3.7-flash"
                }
            );

        setState(
            "System bereit"
        );

    }catch(error){

        console.error(
            "AI Setup:",
            error
        );

        setState(
            "KI konnte nicht geladen werden"
        );

    }

}


/* =====================================================
   QUOTA FEHLER
===================================================== */

function handleQuotaError(){

    isThinking = false;

    core.classList.remove(
        "thinking"
    );

    questionsUsed =
        MAX_QUESTIONS;

    localStorage.setItem(
        "nova_questions_used",
        questionsUsed
    );

    updateQuota();

    const message =
        "Mein aktuelles KI-Kontingent ist gerade aufgebraucht. Bitte versuche es später erneut.";

    addMessage(
        message,
        "nova"
    );

    setState(
        "Kontingent erreicht"
    );

    if(voiceMode){

        speak(
            message
        );

    }

    clearTimeout(
        retryTimer
    );

    retryTimer =
        setTimeout(
            async () => {

                if(!model)
                    return;

                try{

                    await model.generateContent(
                        "Antworte nur mit OK."
                    );

                    setState(
                        "KI wieder verfügbar"
                    );

                }catch(error){

                    if(
                        String(error)
                            .includes("429")
                    ){

                        handleQuotaRetryOnly();

                    }

                }

            },
            60000
        );

}


function handleQuotaRetryOnly(){

    clearTimeout(
        retryTimer
    );

    retryTimer =
        setTimeout(
            async () => {

                if(!model)
                    return;

                try{

                    await model.generateContent(
                        "Antworte nur mit OK."
                    );

                    setState(
                        "KI wieder verfügbar"
                    );

                }catch(error){

                    if(
                        String(error)
                            .includes("429")
                    ){

                        handleQuotaRetryOnly();

                    }

                }

            },
            60000
        );

}


/* =====================================================
   NACHRICHT SENDEN
===================================================== */

async function sendMessage(){

    const text =
        input.value.trim();

    if(!text)
        return;

    if(isThinking)
        return;

    if(
        questionsUsed >=
        MAX_QUESTIONS
    ){

        const message =
            "Du hast momentan keine Fragen mehr übrig.";

        addMessage(
            message,
            "nova"
        );

        setState(
            "Fragenlimit erreicht"
        );

        if(voiceMode)
            speak(message);

        return;

    }

    if(
        !useQuestion()
    ){

        return;

    }

    input.value =
        "";

    stopListening();

    addMessage(
        text,
        "user"
    );

    if(!model){

        const message =
            "Die KI ist noch nicht bereit.";

        addMessage(
            message,
            "nova"
        );

        if(voiceMode)
            speak(message);

        return;

    }

    isThinking =
        true;

    core.classList.add(
        "thinking"
    );

    setState(
        "Nova denkt"
    );


    const prompt = `

Du bist Nova, eine moderne persönliche KI.

Antworte immer auf Deutsch.

Sei freundlich, natürlich und intelligent.

Normalerweise kurz antworten.

Wenn der Benutzer ausdrücklich mehr Details möchte,
darfst du ausführlicher antworten.

Wenn YouTube geöffnet werden soll:
[ACTION:YOUTUBE]

Wenn Google geöffnet werden soll:
[ACTION:GOOGLE]

Benutzer:
${text}

`;


    try{

        const result =
            await model.generateContent(
                prompt
            );

        let answer =
            result.response.text();

        let action =
            null;


        if(
            answer.includes(
                "[ACTION:YOUTUBE]"
            )
        ){

            action =
                "youtube";

            answer =
                answer.replace(
                    "[ACTION:YOUTUBE]",
                    ""
                ).trim();

        }


        if(
            answer.includes(
                "[ACTION:GOOGLE]"
            )
        ){

            action =
                "google";

            answer =
                answer.replace(
                    "[ACTION:GOOGLE]",
                    ""
                ).trim();

        }


        if(!answer){

            answer =
                "Natürlich.";

        }


        addMessage(
            answer,
            "nova"
        );


        if(
            action === "youtube"
        ){

            window.open(
                "https://www.youtube.com/",
                "_blank"
            );

        }


        if(
            action === "google"
        ){

            window.open(
                "https://www.google.com/",
                "_blank"
            );

        }


        isThinking =
            false;

        core.classList.remove(
            "thinking"
        );


        if(voiceMode){

            speak(
                answer
            );

        }else{

            setState(
                "Textmodus"
            );

        }


    }catch(error){

        console.error(
            "AI:",
            error
        );

        const errorString =
            String(error);


        if(
            errorString.includes("429") ||
            errorString.includes("quota") ||
            errorString.includes("Quota")
        ){

            handleQuotaError();

            return;

        }


        isThinking =
            false;

        core.classList.remove(
            "thinking"
        );


        const message =
            "Ich konnte die KI gerade nicht erreichen.";

        addMessage(
            message,
            "nova"
        );

        setState(
            "Verbindungsfehler"
        );


        if(voiceMode){

            speak(
                message
            );

        }

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    try{

        await signInWithPopup(
            auth,
            provider
        );

    }catch(error){

        console.error(
            "Login:",
            error
        );

        alert(
            "Anmeldung fehlgeschlagen."
        );

    }

}


async function logout(){

    try{

        await signOut(
            auth
        );

    }catch(error){

        console.error(
            error
        );

    }

}


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        currentUser =
            user;

        if(user){

            loginOverlay.style.display =
                "none";

            loginButton.style.display =
                "none";

            logoutButton.style.display =
                "block";


            try{

                const reference =
                    doc(
                        db,
                        "users",
                        user.uid
                    );

                const snapshot =
                    await getDoc(
                        reference
                    );

                if(
                    !snapshot.exists()
                ){

                    await setDoc(
                        reference,
                        {
                            name:
                                user.displayName || "",

                            email:
                                user.email || "",

                            created:
                                Date.now()
                        }
                    );

                }

            }catch(error){

                console.log(
                    "Firestore:",
                    error
                );

            }


            if(
                chat.children.length === 0
            ){

                addMessage(
                    "Hallo! Ich bin Nova. Wie kann ich dir helfen?",
                    "nova"
                );

            }


            await setupAI();

        }else{

            loginOverlay.style.display =
                "flex";

            loginButton.style.display =
                "block";

            logoutButton.style.display =
                "none";

        }

    }
);


/* =====================================================
   BUTTONS
===================================================== */

googleLogin.onclick =
    login;

loginButton.onclick =
    login;

logoutButton.onclick =
    logout;

sendButton.onclick =
    sendMessage;

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   MIKROFON
===================================================== */

micButton.onclick =
    () => {

        if(!recognition){

            alert(
                "Dein Browser unterstützt keine Spracherkennung."
            );

            return;

        }

        if(
            questionsUsed >=
            MAX_QUESTIONS
        ){

            setState(
                "Fragenlimit erreicht"
            );

            return;

        }

        if(isSpeaking)
            return;


        if(isListening){

            stopListening();

            setState(
                "Mikrofon ausgeschaltet"
            );

        }else{

            voiceMode =
                true;

            voiceModeButton.textContent =
                "Sprache";

            startListening();

        }

    };


/* =====================================================
   SPRACHMODUS
===================================================== */

voiceModeButton.onclick =
    () => {

        voiceMode =
            !voiceMode;

        if(!voiceMode){

            stopListening();

            speechSynthesis.cancel();

            isSpeaking =
                false;

            voiceModeButton.textContent =
                "Text";

            setState(
                "Textmodus"
            );

        }else{

            voiceModeButton.textContent =
                "Sprache";

            setState(
                "Bereit"
            );

        }

    };


/* =====================================================
   STIMME TESTEN
===================================================== */

testVoiceButton.onclick =
    () => {

        speak(
            "Hallo. Ich bin Nova. Meine deutsche Stimme funktioniert."
        );

    };


/* =====================================================
   YOUTUBE
===================================================== */

youtubeButton.onclick =
    () => {

        window.open(
            "https://www.youtube.com/",
            "_blank"
        );

    };


/* =====================================================
   GOOGLE
===================================================== */

googleButton.onclick =
    () => {

        window.open(
            "https://www.google.com/",
            "_blank"
        );

    };


/* =====================================================
   VOICES
===================================================== */

if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
        () => {

            speechSynthesis.getVoices();

        };

}


setState(
    "System wird gestartet"
);
